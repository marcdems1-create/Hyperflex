<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Profile — HYPERFLEX</title>
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Trader Profile — HYPERFLEX">
  <meta property="og:description" content="Verified prediction market track record on HYPERFLEX. FLEX score, wallet class, CLV and resolved trade ledger.">
  <meta property="og:image" content="https://hyperflex.network/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#0b0b12; --card:#0e0e15; --card-2:#12121b;
      --ink:#f2f2f7; --dim:#a6a6bd; --soft:#d2d2e0; --border:#242433;
      --cyan:#22d3ee; --green:#22c55e; --red:#ef4444;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      --mono:'JetBrains Mono',ui-monospace,monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
    a{color:inherit;text-decoration:none}
    #nav-root{position:relative;z-index:200}
    .wrap{max-width:1600px;margin:0 auto;padding:56px 40px 120px}

    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}

    /* Card header strip */
    .card-head{display:flex;align-items:baseline;justify-content:space-between;padding:34px 52px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:16px}
    .who{font-family:var(--mono);font-size:40px;font-weight:600;color:var(--ink)}
    .who-sub{font-family:var(--mono);font-size:26px;color:var(--dim);margin-left:16px}
    .brand{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:0.14em;color:var(--cyan)}
    .card-actions{display:flex;align-items:center;gap:10px}
    .btn-mini{font-family:var(--mono);font-size:16px;font-weight:600;padding:9px 18px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
    .btn-mini:hover{border-color:var(--cyan);color:var(--cyan)}
    @media(max-width:640px){.card-head{padding:24px 24px}.btn-mini{font-size:14px;padding:7px 14px}}

    /* Hero score */
    .hero{padding:60px 52px 52px}
    .score{font-family:var(--mono);font-size:200px;font-weight:700;color:var(--cyan);line-height:1;letter-spacing:-0.04em}
    .score.mute{color:var(--dim)}
    .score-lbl{font-family:var(--mono);font-size:28px;letter-spacing:0.22em;text-transform:uppercase;color:var(--dim);margin-left:32px}
    .score-row{display:flex;align-items:baseline}

    /* Auto-generated trade bio */
    .trade-bio{font-size:29px;color:var(--soft);line-height:1.65;margin-top:40px;max-width:1240px}

    /* Stat quad */
    .quad{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
    .q{padding:36px 40px;border-right:1px solid var(--border)}
    .q:last-child{border-right:none}
    .q-lbl{font-family:var(--mono);font-size:21px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim)}
    .q-val{font-family:var(--mono);font-size:66px;font-weight:700;margin-top:16px;letter-spacing:-0.03em;line-height:1}
    .q-sub{font-family:var(--mono);font-size:23px;color:var(--dim);margin-top:14px}
    .pos{color:var(--green)} .neg{color:var(--red)} .cy{color:var(--cyan)}
    @media(max-width:900px){.quad{grid-template-columns:repeat(2,1fr)}.q{border-bottom:1px solid var(--border)}.score{font-size:110px}.trade-bio{font-size:19px}}

    /* Meta strip */
    .strip{padding:30px 52px;border-bottom:1px solid var(--border);font-size:25px;color:var(--dim)}
    .strip b{color:var(--ink);font-weight:500}

    /* Chart */
    .chart-wrap{padding:44px 52px 40px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--card-2);min-height:280px}
    .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
    .chart-lbl{font-family:var(--mono);font-size:21px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim)}

    .chart-grid{display:grid;grid-template-columns:76px 1fr;grid-template-rows:220px 30px;column-gap:12px}
    .chart-ylabels{grid-column:1;grid-row:1;position:relative}
    .chart-ylabel{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--mono);font-size:16px;color:var(--dim);white-space:nowrap}
    .chart-plot{grid-column:2;grid-row:1;position:relative;overflow:visible}
    .chart-plot-gridline{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,0.07)}
    svg.spark{position:absolute;inset:0;width:100%;height:100%;display:block}
    .chart-pt-hit{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;background:transparent;border:none;padding:0}
    .chart-pt-hit:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
    .chart-peak-dot{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--card-2);pointer-events:none}
    .chart-peak-dot.pos{background:var(--green)} .chart-peak-dot.neg{background:var(--red)}
    .chart-peak-label{position:absolute;transform:translate(-50%,0);pointer-events:none;max-width:260px;text-align:center}
    .chart-peak-label.align-start{transform:translate(0,0);text-align:left}
    .chart-peak-label.align-end{transform:translate(-100%,0);text-align:right}
    .chart-peak-q{font-family:var(--mono);font-size:15px;color:var(--soft);line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
    .chart-peak-delta{font-family:var(--mono);font-size:16px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
    .chart-peak-delta.pos{color:var(--green)} .chart-peak-delta.neg{color:var(--red)}

    .chart-xlabels{grid-column:2;grid-row:2;position:relative}
    .chart-xlabel{position:absolute;top:6px;font-family:var(--mono);font-size:16px;color:var(--dim);white-space:nowrap}

    .chart-badge{position:absolute;top:10px;right:10px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:2px;background:rgba(15,15,22,0.92);border:1px solid rgba(34,211,238,0.35);border-radius:10px;padding:8px 14px}
    .chart-badge-lbl{font-family:var(--mono);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cyan);opacity:0.75}
    .chart-badge-val{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--cyan)}

    .chart-tip{position:absolute;z-index:10;display:none;min-width:200px;max-width:260px;background:#1a1a22;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:12px 15px;box-shadow:0 8px 24px rgba(0,0,0,0.5);pointer-events:none}
    .chart-tip-q{font-family:var(--sans);font-size:16px;color:var(--ink);line-height:1.35;margin-bottom:6px}
    .chart-tip-meta{font-family:var(--mono);font-size:14px;color:var(--dim);margin-bottom:6px}
    .chart-tip-side{color:var(--cyan);font-weight:700}
    .chart-tip-delta{font-family:var(--mono);font-size:17px;font-weight:700}
    .chart-tip-delta.pos{color:var(--green)} .chart-tip-delta.neg{color:var(--red)}

    @media(max-width:640px){
      .chart-wrap{padding:28px 20px 30px}
      .chart-head{flex-direction:column;align-items:flex-start;gap:4px}
      .chart-lbl{font-size:15px}
      .chart-grid{grid-template-columns:54px 1fr}
      .chart-ylabel{font-size:13px}
      .chart-xlabel{font-size:13px}
      .chart-peak-q{font-size:13px}
      .chart-peak-label{max-width:180px}
      .chart-badge{top:6px;right:6px;padding:6px 10px}
      .chart-badge-val{font-size:18px}
    }

    /* Verification badge */
    .verify{display:flex;align-items:flex-start;gap:14px;margin-top:22px;padding:16px 20px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);max-width:900px}
    .verify.ok{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.06)}
    .verify.part{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.06)}
    .verify.bad{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.07)}
    .verify-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:8px;background:var(--dim)}
    .verify.ok .verify-dot{background:var(--green)}
    .verify.part .verify-dot{background:#f59e0b}
    .verify.bad .verify-dot{background:var(--red)}
    .verify-label{font-size:21px;font-weight:600;color:var(--ink);line-height:1.3}
    .verify-detail{font-size:17px;color:var(--soft);line-height:1.55;margin-top:5px}

    /* Open positions — the copyable layer */
    .open-side{display:inline-block;font-family:var(--mono);font-size:19px;font-weight:700;padding:3px 12px;border-radius:6px;background:rgba(34,211,238,0.12);color:var(--cyan);margin-right:14px;vertical-align:2px}
    .open-live{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:19px;color:var(--green);text-transform:none;letter-spacing:0}
    .open-live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
    .row-link{color:var(--cyan)}
    .row-link:hover{text-decoration:underline}
    .open-exposure{padding:0 52px 20px;font-size:20px;color:var(--soft);line-height:1.55;max-width:1100px}
    .open-exposure b{color:var(--ink);font-weight:600}
    .row-copy{border-color:rgba(34,197,94,0.35);color:var(--green)}
    .row-copy:hover{border-color:var(--green);background:rgba(34,197,94,0.08)}

    /* How they trade — risk / style disclosure */
    .risk{padding:30px 34px;border-top:1px solid var(--border)}
    .risk-head{font-family:var(--mono);font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
    .risk-style{font-size:22px;color:var(--ink);line-height:1.45;margin-bottom:20px;max-width:820px}
    .risk-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-bottom:8px}
    .risk-seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden}
    .risk-seg.sold{background:rgba(245,158,11,0.22);color:#f7c774}
    .risk-seg.held{background:rgba(34,197,94,0.20);color:#7ee0a0}
    .risk-legend{font-family:var(--mono);font-size:14px;color:var(--dim);margin-bottom:22px}
    .flag{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--border)}
    .flag:first-of-type{border-top:none}
    .flag-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:7px}
    .flag-dot.high{background:var(--red)} .flag-dot.medium{background:#f59e0b} .flag-dot.low{background:var(--dim)}
    .flag-label{font-size:20px;font-weight:600;color:var(--ink);line-height:1.3}
    .flag-detail{font-size:16px;color:var(--soft);line-height:1.6;margin-top:6px;max-width:780px}

    /* Resolution ledger */
    .led-head{font-family:var(--mono);font-size:21px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);padding:44px 52px 22px;border-top:1px solid var(--border)}
    .led-head.with-live{display:flex;justify-content:space-between;align-items:baseline}
    .row{display:flex;justify-content:space-between;align-items:flex-start;gap:40px;padding:32px 52px;border-bottom:1px solid var(--border)}
    .row:last-of-type{border-bottom:none}
    .row-q{font-size:31px;font-weight:500;color:var(--ink);line-height:1.35}
    .row-meta{font-family:var(--mono);font-size:23px;color:var(--dim);margin-top:13px}
    .tag{font-weight:700}
    .row-amt{font-family:var(--mono);font-size:36px;font-weight:600;white-space:nowrap;padding-top:2px}

    .foot{display:flex;justify-content:space-between;padding:34px 52px;border-top:1px solid var(--border);font-family:var(--mono);font-size:22px;color:var(--dim)}

    .state{text-align:center;padding:120px 20px;color:var(--dim)}
    .state h2{font-size:34px;color:var(--ink);font-weight:600;margin-bottom:14px}
    .skeleton{color:var(--dim);text-align:center;padding:120px 20px;font-family:var(--mono);font-size:19px;letter-spacing:0.2em;text-transform:uppercase}
  </style>
</head>
<body>
  <div id="nav-root"></div>
  <script src="/nav.js?v=26"></script>

  <div class="wrap">
    <div id="root"><div class="skeleton">Loading profile…</div></div>
  </div>

  <script>
  (function(){
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}

    function usd(v){
      var n=num(v); if(n==null) return '—';
      var neg=n<0; n=Math.abs(n);
      var s = n>=1e6 ? '$'+(n/1e6).toFixed(1)+'M'
            : n>=1e4 ? '$'+Math.round(n/1e3)+'K'
            : '$'+Math.round(n).toLocaleString();
      return (neg?'−':'')+s;
    }
    function signedUsd(v){
      var n=num(v); if(n==null) return '—';
      return (n>=0?'+':'')+usd(Math.abs(n));
    }
    function pct(v,d){var n=num(v); return n==null?'—':n.toFixed(d==null?1:d)+'%';}
    function signedPct(v){var n=num(v); return n==null?'—':(n>=0?'+':'')+n.toFixed(1)+'%';}
    function cents(v){var n=num(v); return n==null?'—':(n>=0?'+':'')+n.toFixed(1)+'¢';}
    function price(v){var n=num(v); if(n==null) return '—'; return n>=1 ? '$1.00' : (n<=0 ? '$0.00' : Math.round(n*100)+'¢');}

    // CLV letter grade from average cents of closing-line value. Thresholds
    // are display buckets over a real measured number — not a separate score.
    function clvGrade(c){
      var n=num(c); if(n==null) return null;
      if(n>=20) return 'A'; if(n>=10) return 'B'; if(n>=0) return 'C'; return 'D';
    }

    var CLASS_LABEL = { sharp:'SHARP', good:'GOOD', square:'SQUARE', fade:'FADE' };

    // Inline onclick handlers run in global scope, so this needs to live on
    // window rather than staying trapped in the surrounding IIFE closure.
    window.shareTraderCard = function(handle){
      var text = 'My prediction market track record on HYPERFLEX\n\nhyperflex.network/@' + handle;
      window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text), '_blank', 'noopener');
    };

    // Series data for the currently-rendered chart, keyed by point index —
    // the tap handler below is global (inline onclick runs outside the
    // IIFE closure, same reason shareTraderCard lives on window) so it
    // needs a place to look up the point that was tapped.
    var chartSeriesData = null;

    function chartDateLabel(t){
      var d = new Date(t);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
    }
    function chartRoiLabel(v){
      var n = num(v); if (n==null) return '—';
      return (n>=0?'+':'') + n.toFixed(1) + '%';
    }

    // Tap/click tooltip — no hover-only state, mobile-first per spec. Reuses
    // the dark-card tooltip look already established elsewhere (.cal-tooltip
    // in predictors.html/member.html) but that pattern is hover:show/hide
    // only, so this is a tap-driven variant rather than a straight reuse.
    window.__hfChartTap = function(evt, idx){
      evt.stopPropagation();
      var series = chartSeriesData;
      var tip = document.getElementById('chartTip');
      var wrap = document.getElementById('chartWrap');
      if (!series || !series[idx] || !tip || !wrap) return;
      var p = series[idx];
      var delta = num(p.trade_roi_pct);
      var sideStr = p.side ? String(p.side).toUpperCase() : '';
      tip.innerHTML =
        '<div class="chart-tip-q">' + esc(p.market_question || 'Unknown market') + '</div>' +
        '<div class="chart-tip-meta">' + esc(chartDateLabel(p.t)) +
          (sideStr ? ' &middot; <span class="chart-tip-side">' + esc(sideStr) + '</span>' : '') +
        '</div>' +
        '<div class="chart-tip-delta ' + (delta==null ? '' : (delta>=0?'pos':'neg')) + '">' +
          chartRoiLabel(delta) + ' this trade</div>';

      var wrapRect = wrap.getBoundingClientRect();
      var elRect = evt.currentTarget.getBoundingClientRect();
      tip.style.display = 'block';
      var tipW = tip.offsetWidth || 220;
      var left = (elRect.left - wrapRect.left + elRect.width/2) - tipW/2;
      left = Math.max(8, Math.min(left, wrapRect.width - tipW - 8));
      var top = (elRect.top - wrapRect.top) - tip.offsetHeight - 14;
      if (top < 0) top = (elRect.bottom - wrapRect.top) + 14;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
    };
    document.addEventListener('click', function(e){
      var tip = document.getElementById('chartTip');
      if (tip && tip.style.display === 'block' && !e.target.closest('.chart-pt-hit')) {
        tip.style.display = 'none';
      }
    });

    function roiChart(series){
      if(!series || series.length<2) return '';
      chartSeriesData = series;

      var vals = series.map(function(p){return num(p.roi_pct)||0;});
      var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
      if (max===min) { max += 1; min -= 1; }
      var pad = (max-min)*0.1;
      min -= pad; max += pad;
      var range = max-min;

      function xPct(i){ return (i/(series.length-1))*100; }
      function yPct(v){ return 100 - ((v-min)/range)*100; }

      // Line + fill — plain SVG, viewBox 0-100 on both axes so the
      // coordinate math lines up 1:1 with the percentage-based HTML overlay
      // used for axis labels, points, and the peak annotation below.
      var line = vals.map(function(v,i){ return xPct(i).toFixed(2)+','+yPct(v).toFixed(2); }).join(' ');
      var area = '0,100 ' + line + ' 100,100';
      var svg = '<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Cumulative ROI over resolved trades">' +
        '<polygon points="'+area+'" fill="rgba(34,211,238,0.10)"></polygon>' +
        '<polyline points="'+line+'" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>' +
      '</svg>';

      // Y axis — 4 gridlines spanning the padded range.
      var GRID_N = 4, gridlines = '', ylabels = '';
      for (var g=0; g<GRID_N; g++){
        var gv = min + (g/(GRID_N-1))*range;
        var gy = yPct(gv);
        gridlines += '<div class="chart-plot-gridline" style="top:'+gy.toFixed(2)+'%"></div>';
        ylabels += '<span class="chart-ylabel" style="top:'+gy.toFixed(2)+'%">'+chartRoiLabel(gv)+'</span>';
      }

      // X axis — evenly-spaced date ticks. Fewer on narrow viewports so
      // labels don't collide (5 ticks needs ~60px each, which a phone-width
      // plot column doesn't have).
      var narrow = window.innerWidth < 480;
      var TICK_N = Math.min(narrow ? 3 : 5, series.length), xlabels = '';
      for (var t=0; t<TICK_N; t++){
        var idx = TICK_N===1 ? 0 : Math.round((t/(TICK_N-1))*(series.length-1));
        var tx = xPct(idx);
        var align = t===0 ? 'left:0;transform:translateX(0)' :
                    (t===TICK_N-1 ? 'left:'+tx.toFixed(2)+'%;transform:translateX(-100%)' :
                                     'left:'+tx.toFixed(2)+'%;transform:translateX(-50%)');
        xlabels += '<span class="chart-xlabel" style="'+align+'">'+esc(chartDateLabel(series[idx].t))+'</span>';
      }

      // Tap targets — every point is tappable, per spec. Rendered as
      // invisible hit areas (26px, real touch-target size) rather than SVG
      // circles so they aren't distorted by the non-uniform viewBox stretch.
      var hitTargets = series.map(function(p,i){
        return '<button type="button" class="chart-pt-hit" style="left:'+xPct(i).toFixed(2)+'%;top:'+yPct(num(p.roi_pct)||0).toFixed(2)+'%" ' +
          'aria-label="' + esc((p.market_question||'trade') + ', ' + chartDateLabel(p.t)) + '" ' +
          'onclick="window.__hfChartTap(event,'+i+')"></button>';
      }).join('');

      // Auto-annotation on the single largest-magnitude single-trade ROI
      // delta (win or loss) — legible without tapping, per spec. Only one
      // point is ever annotated this way; multi-point annotation is a
      // future pass.
      var peakIdx=-1, peakAbs=-1;
      series.forEach(function(p,i){
        var d = num(p.trade_roi_pct);
        if (d!=null && Math.abs(d)>peakAbs){ peakAbs=Math.abs(d); peakIdx=i; }
      });
      var peakMarkup = '';
      if (peakIdx>=0){
        var pp = series[peakIdx];
        var px = xPct(peakIdx), py = yPct(num(pp.roi_pct)||0);
        var delta = num(pp.trade_roi_pct);
        var isPos = delta==null || delta>=0;
        var alignCls = px>72 ? 'align-end' : (px<28 ? 'align-start' : '');
        // Keep clear of the current-value badge pinned in the top-right
        // corner of the plot — force the label below the point there
        // instead of above it.
        var nearBadge = px>55 && py<22;
        var labelTop = (py>28 && !nearBadge) ? (py-24)+'%' : (py+8)+'%';
        var qShort = (pp.market_question||'').length>34 ? pp.market_question.slice(0,34)+'…' : (pp.market_question||'');
        peakMarkup =
          '<div class="chart-peak-dot ' + (isPos?'pos':'neg') + '" style="left:'+px.toFixed(2)+'%;top:'+py.toFixed(2)+'%"></div>' +
          '<div class="chart-peak-label ' + alignCls + '" style="left:'+px.toFixed(2)+'%;top:'+labelTop+'">' +
            '<div class="chart-peak-q">' + esc(qShort) + '</div>' +
            '<div class="chart-peak-delta ' + (isPos?'pos':'neg') + '">' + chartRoiLabel(delta) + '</div>' +
          '</div>';
      }

      var lastVal = vals[vals.length-1];
      var badge = '<div class="chart-badge"><span class="chart-badge-lbl">current</span>' +
        '<span class="chart-badge-val">' + chartRoiLabel(lastVal) + '</span></div>';

      return '<div class="chart-wrap" id="chartWrap">' +
          '<div class="chart-head"><span class="chart-lbl">cumulative ROI</span>' +
          '<span class="chart-lbl">' + series.length + ' resolved</span></div>' +
          '<div class="chart-grid">' +
            '<div class="chart-ylabels">' + ylabels + '</div>' +
            '<div class="chart-plot">' + gridlines + svg + peakMarkup + hitTargets + badge + '</div>' +
            '<div class="chart-xlabels">' + xlabels + '</div>' +
          '</div>' +
          '<div class="chart-tip" id="chartTip"></div>' +
        '</div>';
    }

    function render(d){
      d = d || {};
      var c = d.card || null;
      var name = d.handle || d.display_name || 'trader';
      var wc = (d.wallet_class || '').toLowerCase();
      var grade = clvGrade(d.clv_avg_cents);

      var flexNum = (d.flex_score == null) ? '—' : String(d.flex_score);

      // ── header + hero score
      var head =
        '<div class="card-head">' +
          '<div><span class="who">@' + esc(name) + '</span><span class="who-sub">· trader profile</span></div>' +
          '<div class="card-actions">' +
            '<button class="btn-mini" onclick="shareTraderCard(' + JSON.stringify(name).replace(/"/g, '&quot;') + ')">Share on X</button>' +
            '<a class="btn-mini" href="/@' + esc(name) + '/passport">Passport &#8594;</a>' +
            '<span class="brand">HYPERFLEX</span>' +
          '</div>' +
        '</div>';

      var bio = d.trade_bio ? '<div class="trade-bio">' + esc(d.trade_bio) + '</div>' : '';

      // Verification badge — filled async by loadVerification(). The card
      // asserts this record is reconciled against on-chain activity; this
      // is where a visitor can actually see that check's result rather
      // than take it on trust.
      var verifySlot = '<div id="verifySlot"></div>';

      var hero =
        '<div class="hero">' +
          '<div class="score-row">' +
            '<span class="score' + (flexNum==='—'?' mute':'') + '">' + flexNum + '</span>' +
            '<span class="score-lbl">flex score</span>' +
          '</div>' + verifySlot + bio +
        '</div>';

      // ── stat quad
      var winRate = c && c.win_rate_pct != null ? c.win_rate_pct : num(d.prediction_win_rate);
      var nCount  = c && c.n != null ? c.n : num(d.predictions_resolved);
      var roi     = c ? c.realized_roi_pct : null;

      var quad =
        '<div class="quad">' +
          '<div class="q"><div class="q-lbl">CLV grade</div>' +
            '<div class="q-val">' + (grade || '—') + '</div>' +
            '<div class="q-sub">avg ' + cents(d.clv_avg_cents) + '</div></div>' +
          '<div class="q"><div class="q-lbl">win rate</div>' +
            '<div class="q-val">' + pct(winRate, 0) + '</div>' +
            '<div class="q-sub">' + (nCount != null ? nCount + ' trades' : '—') + '</div></div>' +
          '<div class="q"><div class="q-lbl">realized ROI</div>' +
            '<div class="q-val ' + (roi == null ? '' : (roi >= 0 ? 'pos' : 'neg')) + '">' + signedPct(roi) + '</div>' +
            '<div class="q-sub">' + (c && c.total_staked_usd ? usd(c.total_staked_usd) + ' staked' : 'all time') + '</div></div>' +
          '<div class="q"><div class="q-lbl">wallet class</div>' +
            '<div class="q-val cy">' + (CLASS_LABEL[wc] || '—') + '</div>' +
            '<div class="q-sub">' + (d.clv_sample_size ? d.clv_sample_size + ' trades' : 'unrated') + '</div></div>' +
        '</div>';

      // ── meta strip
      var stripBits = [];
      if (c && c.avg_hold_days != null) {
        var hd = c.avg_hold_days;
        // Sub-day averages are real (same-session sports books), not a
        // missing value — show "<1d" rather than a bare "0d".
        var hdLabel = hd < 1 ? '&lt;1d' : (hd < 10 ? hd.toFixed(1) : Math.round(hd)) + 'd';
        stripBits.push('Avg hold <b>' + hdLabel + '</b>'
          + (c.avg_hold_known_n != null && c.n && c.avg_hold_known_n < c.n
              ? ' <span style="opacity:.7">(' + c.avg_hold_known_n + ' of ' + c.n + ' timed)</span>' : ''));
      }
      if (c && c.avg_size_usd != null)  stripBits.push('Avg size <b>' + usd(c.avg_size_usd) + '</b>');
      if (c && c.categories && c.categories.length) stripBits.push('Categories <b>' + c.categories.map(esc).join(' · ') + '</b>');
      // Always link the methodology, even when no meta bits exist — the
      // score should never appear without a route to what it does (and
      // does not) claim.
      stripBits.push('<a href="/methodology" style="color:var(--cyan)">How this is calculated</a>');
      var strip = '<div class="strip">' + stripBits.join(' &nbsp;·&nbsp; ') + '</div>';

      // ── chart
      var chart = (c && c.roi_series && c.roi_series.length > 1) ? roiChart(c.roi_series) : '';

      // ── how they trade (risk / style disclosure)
      var risk = '';
      if (c && c.risk_profile) {
        var rp = c.risk_profile;
        var soldPct = rp.resolution_style.sold_early_pct;
        var heldPct = rp.resolution_style.held_to_resolution_pct;
        // Resolution-style bar only when there's a real split to show.
        var bar = '';
        if (soldPct + heldPct >= 95) {
          var segs = '';
          if (soldPct > 0) segs += '<div class="risk-seg sold" style="width:' + soldPct + '%">' + (soldPct >= 12 ? soldPct + '% sold early' : '') + '</div>';
          if (heldPct > 0) segs += '<div class="risk-seg held" style="width:' + heldPct + '%">' + (heldPct >= 12 ? heldPct + '% held' : '') + '</div>';
          bar = '<div class="risk-bar">' + segs + '</div>' +
            '<div class="risk-legend">Sold early = exited on a price move before the market resolved. Held = kept to resolution.</div>';
        }
        var flags = (rp.flags || []).map(function(f){
          return '<div class="flag">' +
            '<div class="flag-dot ' + f.severity + '"></div>' +
            '<div><div class="flag-label">' + esc(f.label) + '</div>' +
            '<div class="flag-detail">' + esc(f.detail) + '</div></div>' +
          '</div>';
        }).join('');
        risk = '<div class="risk">' +
          '<div class="risk-head">how they trade</div>' +
          '<div class="risk-style">' + esc(rp.style) + '</div>' +
          bar + flags +
        '</div>';
      }

      // ── resolution ledger
      var ledger = '';
      if (c && c.resolutions && c.resolutions.length) {
        ledger = '<div class="led-head">recent resolutions</div>' + c.resolutions.map(function(r){
          var isWin = r.outcome === 'win', isLoss = r.outcome === 'loss';
          var tagCls = isWin ? 'pos' : (isLoss ? 'neg' : '');
          var tag = isWin ? 'WIN' : (isLoss ? 'LOSS' : 'PUSH');
          var bits = ['<span class="tag ' + tagCls + '">' + tag + '</span>'];
          if (r.staked_usd != null) bits.push(usd(r.staked_usd) + ' staked');
          if (r.entry_price != null) bits.push(price(r.entry_price) + ' → ' + price(r.exit_price));
          if (r.held_days != null) bits.push(r.held_days + 'd held');
          return '<div class="row">' +
            '<div><div class="row-q">' + esc(r.question || '') + '</div>' +
            '<div class="row-meta">' + bits.join(' · ') + '</div></div>' +
            '<div class="row-amt ' + tagCls + '">' + signedUsd(r.pnl_usd) + '</div>' +
          '</div>';
        }).join('');
      }

      var foot =
        '<div class="foot">' +
          '<span>hyperflex.network/@' + esc(name) + '</span>' +
          '<span>' + (c && c.n != null ? c.n + ' resolved · ' : '') + 'updated live</span>' +
        '</div>';

      // Open-positions slot — filled asynchronously by loadOpenPositions so
      // the live Polymarket fetch never blocks the card paint. Sits above
      // the resolved ledger: what they hold NOW is the actionable part,
      // the resolved history below it is the evidence they're worth copying.
      var openSlot = '<div id="openSlot"></div>';

      document.getElementById('root').innerHTML =
        '<div class="card">' + head + hero + quad + strip + risk + chart + openSlot + ledger + foot + '</div>';

      if (d.polymarket_address) loadOpenPositions(d.polymarket_address, d.durable_verified === true, d.id);
      loadVerification(name);
    }

    // Internal market page keeps the trade on our builder-fee path; falls
    // back to the Polymarket URL when the slug can't be recovered.
    function marketHref(p){
      var m = /polymarket\.com\/event\/([^/?#]+)/.exec(p.market_url || '');
      return m ? '/market/' + m[1] : (p.market_url || 'https://polymarket.com');
    }

    // Assisted copy-trading link — one tap opens the destination market's
    // EXISTING trade widget prefilled with the same side, a small default
    // stake the user can change, and this trader's id for provenance. The
    // user's own wallet still signs; nothing here executes anything.
    // `from=trader` is market.html's applyAlphaPrefill hook, purpose-built
    // for exactly this ("Copy Trade buttons on sharp profiles" per its own
    // comment) but never wired to an actual button until now.
    // No internal slug, no button — copying to a raw polymarket.com URL
    // would route around our builder-fee path (guardrail: keep it on
    // /market/:slug). Same for a side we can't confidently map to yes/no.
    var COPY_DEFAULT_USD = 25; // matches the site's existing default trade/copy-chip amount
    function copyHref(p, traderId){
      var m = /polymarket\.com\/event\/([^/?#]+)/.exec(p.market_url || '');
      if (!m) return null;
      var side = String(p.side || '').toLowerCase();
      if (side !== 'yes' && side !== 'no') return null;
      var params = ['from=trader', 'side=' + side, 'size=' + COPY_DEFAULT_USD];
      if (traderId) params.push('copy_user_id=' + encodeURIComponent(traderId));
      return '/market/' + m[1] + '?' + params.join('&');
    }

    // Public verification badge. The card claims this record is reconciled
    // against on-chain activity — this shows the actual result of that
    // check, including when it's only partial. Never rounds "unconfirmable"
    // up to "verified".
    function loadVerification(handle){
      fetch('/api/verify-record/' + encodeURIComponent(handle))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(v){
          var slot = document.getElementById('verifySlot');
          if (!slot || !v || !v.status) return;
          var cls = v.status === 'verified' ? 'ok' : (v.status === 'failed' ? 'bad' : 'part');
          var label = v.status === 'verified' ? 'Verified against on-chain activity'
                    : (v.status === 'failed' ? 'Failed verification' : 'Partially verified');
          var oc = v.on_chain || {};
          var detail = [];
          if (oc.trades_in_our_record != null) {
            var d1 = oc.trades_in_our_record + ' trades re-derived from this wallet\'s own transactions';
            // State the scoring subset when it differs, so "N verified" is
            // never read as "N trades behind the score".
            if (oc.trades_counting_toward_score != null && oc.trades_counting_toward_score < oc.trades_in_our_record) {
              d1 += ' (' + oc.trades_counting_toward_score + ' carry the return data needed to rank)';
            }
            detail.push(d1);
          }
          if (oc.trades_with_no_matching_on_chain_activity > 0) detail.push(oc.trades_with_no_matching_on_chain_activity + ' with no matching on-chain activity');
          var rr = v.resolutions || {};
          if (rr.graded_on_unresolved_markets > 0) detail.push(rr.graded_on_unresolved_markets + ' graded on unresolved markets');
          slot.innerHTML = '<div class="verify ' + cls + '">' +
            '<span class="verify-dot"></span>' +
            '<div><div class="verify-label">' + esc(label) + '</div>' +
            '<div class="verify-detail">' + esc(detail.join(' · ') || v.summary) +
            ' · <a href="/api/verify-record/' + encodeURIComponent(handle) + '" style="color:var(--cyan)">see the check</a>' +
            ' · <a href="/methodology" style="color:var(--cyan)">method</a></div></div></div>';
        })
        .catch(function(){});
    }

    function loadOpenPositions(addr, copyable, traderId){
      fetch('/api/polymarket/positions/' + encodeURIComponent(addr))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          var slot = document.getElementById('openSlot');
          if (!slot || !d) return;
          var all = (d.positions || d || []);
          if (!Array.isArray(all)) return;
          // Open only — settled rows are already represented, graded, in the
          // resolved ledger below. Biggest first: position size is the
          // trader's own conviction signal and the most useful sort for
          // someone deciding what to follow.
          var open = all.filter(function(p){ return !p.settled; })
                        .sort(function(a,b){ return (b.cost_basis||0) - (a.cost_basis||0); })
                        .slice(0, 8);
          if (!open.length) {
            slot.innerHTML = '<div class="led-head">open positions</div>' +
              '<div class="row"><div class="row-q" style="color:var(--dim);font-weight:400">' +
              'No open positions — nothing live to follow right now.</div></div>';
            return;
          }
          // ── Open exposure vs the closed record ────────────────────────
          // A win rate counts CLOSED trades only, so a wallet that closes
          // winners and simply never realises losers shows a spotless
          // record while underwater. The closed number isn't wrong; it's
          // incomplete. Sum what's still open and say so whenever real
          // money is sitting at a loss, so the record can't imply more
          // than it measures. (Checked on the board's 100%-win-rate
          // wallet — it came back genuinely clean, but nothing was
          // detecting this, and it's precisely how a perfect record gets
          // manufactured without a single fabricated trade.)
          var allOpen = all.filter(function(p){ return !p.settled; });
          var openCost = 0, openPnl = 0, underwater = 0, underwaterPnl = 0;
          allOpen.forEach(function(p){
            var cb = num(p.cost_basis) || 0, pl = num(p.pnl) || 0;
            openCost += cb; openPnl += pl;
            if (pl < 0) { underwater++; underwaterPnl += pl; }
          });
          var exposure = '';
          if (allOpen.length) {
            var expCls = openPnl >= 0 ? 'pos' : 'neg';
            exposure = '<div class="open-exposure">' +
              'Still open: <b>' + allOpen.length + '</b> position' + (allOpen.length === 1 ? '' : 's') +
              ', ' + usd(openCost) + ' at risk, ' +
              '<span class="' + expCls + '">' + signedUsd(openPnl) + '</span> unrealised' +
              (underwater > 0
                ? ' · <span class="neg">' + underwater + ' underwater (' + signedUsd(underwaterPnl) + ')</span>'
                : '') +
              '. The win rate above counts closed trades only.</div>';
          }

          slot.innerHTML =
            '<div class="led-head with-live"><span>open positions</span>' +
            '<span class="open-live">' + open.length + ' live</span></div>' + exposure +
            open.map(function(p){
              var pnl = num(p.pnl), pnlPct = num(p.pnl_pct);
              var cls = pnl == null ? '' : (pnl > 0 ? 'pos' : (pnl < 0 ? 'neg' : ''));
              var bits = [];
              if (p.cost_basis) bits.push(usd(p.cost_basis) + ' in');
              if (p.current_price != null) bits.push('now ' + price(p.current_price));
              if (pnlPct != null) bits.push((pnlPct >= 0 ? '+' : '') + pnlPct.toFixed(1) + '%');
              if (p.end_date) {
                var dt = new Date(p.end_date);
                if (!isNaN(dt)) bits.push('ends ' + dt.toLocaleDateString('en-US', { month:'short', day:'numeric' }));
              }
              // Copy affordance ONLY on a verified (durable-board) trader —
              // see server-side durable_verified check. A copy button on an
              // unverified record is the exact failure this feature exists
              // to prevent (there'd be nothing behind it worth copying).
              var cLink = copyable ? copyHref(p, traderId) : null;
              var copyBtn = cLink ? '<a class="btn-mini row-copy" href="' + esc(cLink) + '">Copy this &#8594;</a>' : '';
              return '<div class="row">' +
                '<div><div class="row-q">' +
                  '<span class="open-side">' + esc(String(p.side || '').toUpperCase()) + '</span>' +
                  '<a class="row-link" href="' + esc(marketHref(p)) + '">' + esc(p.question || '') + '</a>' +
                '</div>' +
                '<div class="row-meta">' + bits.join(' · ') + '</div>' +
                (copyBtn ? '<div style="margin-top:12px">' + copyBtn + '</div>' : '') +
                '</div>' +
                '<div class="row-amt ' + cls + '">' + signedUsd(pnl) + '</div>' +
              '</div>';
            }).join('');
        })
        .catch(function(e){ console.warn('[profile] open positions failed:', e); });
    }

    function notFound(){
      document.getElementById('root').innerHTML =
        '<div class="state"><h2>Trader not found</h2>' +
        '<div>No profile matches this handle. <a href="/predictors" style="color:var(--cyan)">Browse the leaderboard →</a></div></div>';
    }

    const raw = window.location.pathname.split('/').pop();
    const handle = raw.startsWith('@') ? raw.slice(1) : raw;
    if (!handle) { notFound(); return; }

    fetch('/api/user/profile/' + encodeURIComponent(handle))
      .then(function(r){ if (r.status === 404) { notFound(); return null; } return r.json(); })
      .then(function(d){
        if (!d) return;
        if (d.error) { notFound(); return; }
        document.title = (d.handle || d.display_name || 'Trader') + ' — HYPERFLEX';
        try {
          render(d);
        } catch (err) {
          console.error('[profile] render crashed:', err, '\n  on data:', d);
          document.getElementById('root').innerHTML = '<div class="state"><h2>Couldn\'t load profile</h2><div>Try again in a moment.</div></div>';
        }
      })
      .catch(function(err){
        console.error('[profile] fetch/parse failed:', err);
        document.getElementById('root').innerHTML = '<div class="state"><h2>Couldn\'t load profile</h2><div>Try again in a moment.</div></div>';
      });
  })();
  </script>
</body>
</html>
