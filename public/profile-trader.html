<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Profile — HYPERFLEX</title>
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Trader Profile — HYPERFLEX">
  <meta property="og:description" content="Verified prediction market track record on HYPERFLEX. FLEX score, wallet class, CLV and resolved trade ledger.">
  <meta property="og:image" content="https://hyperflex.network/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#0b0b12; --card:#0e0e15; --card-2:#12121b;
      --ink:#f2f2f7; --dim:#a6a6bd; --soft:#d2d2e0; --border:#242433;
      --cyan:#22d3ee; --green:#22c55e; --red:#ef4444;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      --mono:'JetBrains Mono',ui-monospace,monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:20px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
    a{color:inherit;text-decoration:none}
    #nav-root{position:relative;z-index:200}
    .wrap{max-width:1600px;margin:0 auto;padding:56px 40px 120px}

    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}

    /* Card header strip */
    .card-head{display:flex;align-items:baseline;justify-content:space-between;padding:34px 52px;border-bottom:1px solid var(--border)}
    .who{font-family:var(--mono);font-size:40px;font-weight:600;color:var(--ink)}
    .who-sub{font-family:var(--mono);font-size:26px;color:var(--dim);margin-left:16px}
    .brand{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:0.14em;color:var(--cyan)}

    /* Hero score */
    .hero{padding:60px 52px 52px}
    .score{font-family:var(--mono);font-size:200px;font-weight:700;color:var(--cyan);line-height:1;letter-spacing:-0.04em}
    .score.mute{color:var(--dim)}
    .score-lbl{font-family:var(--mono);font-size:28px;letter-spacing:0.22em;text-transform:uppercase;color:var(--dim);margin-left:32px}
    .score-row{display:flex;align-items:baseline}

    /* Auto-generated trade bio */
    .trade-bio{font-size:29px;color:var(--soft);line-height:1.65;margin-top:40px;max-width:1240px}

    /* Stat quad */
    .quad{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
    .q{padding:36px 40px;border-right:1px solid var(--border)}
    .q:last-child{border-right:none}
    .q-lbl{font-family:var(--mono);font-size:21px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim)}
    .q-val{font-family:var(--mono);font-size:66px;font-weight:700;margin-top:16px;letter-spacing:-0.03em;line-height:1}
    .q-sub{font-family:var(--mono);font-size:23px;color:var(--dim);margin-top:14px}
    .pos{color:var(--green)} .neg{color:var(--red)} .cy{color:var(--cyan)}
    @media(max-width:900px){.quad{grid-template-columns:repeat(2,1fr)}.q{border-bottom:1px solid var(--border)}.score{font-size:110px}.trade-bio{font-size:19px}}

    /* Meta strip */
    .strip{padding:30px 52px;border-bottom:1px solid var(--border);font-size:25px;color:var(--dim)}
    .strip b{color:var(--ink);font-weight:500}

    /* Chart */
    .chart-wrap{padding:44px 52px 22px}
    .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}
    .chart-lbl{font-family:var(--mono);font-size:21px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim)}
    svg.spark{width:100%;height:340px;display:block}

    /* Open positions — the copyable layer */
    .open-side{display:inline-block;font-family:var(--mono);font-size:19px;font-weight:700;padding:3px 12px;border-radius:6px;background:rgba(34,211,238,0.12);color:var(--cyan);margin-right:14px;vertical-align:2px}
    .open-live{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:19px;color:var(--green);text-transform:none;letter-spacing:0}
    .open-live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
    .row-link{color:var(--cyan)}
    .row-link:hover{text-decoration:underline}

    /* How they trade — risk / style disclosure */
    .risk{padding:30px 34px;border-top:1px solid var(--border)}
    .risk-head{font-family:var(--mono);font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
    .risk-style{font-size:22px;color:var(--ink);line-height:1.45;margin-bottom:20px;max-width:820px}
    .risk-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-bottom:8px}
    .risk-seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden}
    .risk-seg.sold{background:rgba(245,158,11,0.22);color:#f7c774}
    .risk-seg.held{background:rgba(34,197,94,0.20);color:#7ee0a0}
    .risk-legend{font-family:var(--mono);font-size:14px;color:var(--dim);margin-bottom:22px}
    .flag{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--border)}
    .flag:first-of-type{border-top:none}
    .flag-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:7px}
    .flag-dot.high{background:var(--red)} .flag-dot.medium{background:#f59e0b} .flag-dot.low{background:var(--dim)}
    .flag-label{font-size:20px;font-weight:600;color:var(--ink);line-height:1.3}
    .flag-detail{font-size:16px;color:var(--soft);line-height:1.6;margin-top:6px;max-width:780px}

    /* Resolution ledger */
    .led-head{font-family:var(--mono);font-size:21px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);padding:44px 52px 22px;border-top:1px solid var(--border)}
    .led-head.with-live{display:flex;justify-content:space-between;align-items:baseline}
    .row{display:flex;justify-content:space-between;align-items:flex-start;gap:40px;padding:32px 52px;border-bottom:1px solid var(--border)}
    .row:last-of-type{border-bottom:none}
    .row-q{font-size:31px;font-weight:500;color:var(--ink);line-height:1.35}
    .row-meta{font-family:var(--mono);font-size:23px;color:var(--dim);margin-top:13px}
    .tag{font-weight:700}
    .row-amt{font-family:var(--mono);font-size:36px;font-weight:600;white-space:nowrap;padding-top:2px}

    .foot{display:flex;justify-content:space-between;padding:34px 52px;border-top:1px solid var(--border);font-family:var(--mono);font-size:22px;color:var(--dim)}

    .state{text-align:center;padding:120px 20px;color:var(--dim)}
    .state h2{font-size:34px;color:var(--ink);font-weight:600;margin-bottom:14px}
    .skeleton{color:var(--dim);text-align:center;padding:120px 20px;font-family:var(--mono);font-size:19px;letter-spacing:0.2em;text-transform:uppercase}
  </style>
</head>
<body>
  <div id="nav-root"></div>
  <script src="/nav.js?v=25"></script>

  <div class="wrap">
    <div id="root"><div class="skeleton">Loading profile…</div></div>
  </div>

  <script>
  (function(){
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}

    function usd(v){
      var n=num(v); if(n==null) return '—';
      var neg=n<0; n=Math.abs(n);
      var s = n>=1e6 ? '$'+(n/1e6).toFixed(1)+'M'
            : n>=1e4 ? '$'+Math.round(n/1e3)+'K'
            : '$'+Math.round(n).toLocaleString();
      return (neg?'−':'')+s;
    }
    function signedUsd(v){
      var n=num(v); if(n==null) return '—';
      return (n>=0?'+':'')+usd(Math.abs(n));
    }
    function pct(v,d){var n=num(v); return n==null?'—':n.toFixed(d==null?1:d)+'%';}
    function signedPct(v){var n=num(v); return n==null?'—':(n>=0?'+':'')+n.toFixed(1)+'%';}
    function cents(v){var n=num(v); return n==null?'—':(n>=0?'+':'')+n.toFixed(1)+'¢';}
    function price(v){var n=num(v); if(n==null) return '—'; return n>=1 ? '$1.00' : (n<=0 ? '$0.00' : Math.round(n*100)+'¢');}

    // CLV letter grade from average cents of closing-line value. Thresholds
    // are display buckets over a real measured number — not a separate score.
    function clvGrade(c){
      var n=num(c); if(n==null) return null;
      if(n>=20) return 'A'; if(n>=10) return 'B'; if(n>=0) return 'C'; return 'D';
    }

    var CLASS_LABEL = { sharp:'SHARP', good:'GOOD', square:'SQUARE', fade:'FADE' };

    function sparkline(series){
      if(!series || series.length<2) return '';
      var vals = series.map(function(p){return num(p.roi_pct)||0;});
      var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
      if(max===min){max=min+1;}
      var W=680, H=340, pad=14;
      var pts = vals.map(function(v,i){
        var x = (i/(vals.length-1))*W;
        var y = H-pad - ((v-min)/(max-min))*(H-pad*2);
        return x.toFixed(1)+','+y.toFixed(1);
      });
      var line = pts.join(' ');
      var area = '0,'+H+' '+line+' '+W+','+H;
      return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Cumulative ROI over resolved trades">'+
        '<polygon points="'+area+'" fill="rgba(34,211,238,0.10)"></polygon>'+
        '<polyline points="'+line+'" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>'+
      '</svg>';
    }

    function render(d){
      d = d || {};
      var c = d.card || null;
      var name = d.handle || d.display_name || 'trader';
      var wc = (d.wallet_class || '').toLowerCase();
      var grade = clvGrade(d.clv_avg_cents);

      var flexNum = (d.flex_score == null) ? '—' : String(d.flex_score);

      // ── header + hero score
      var head =
        '<div class="card-head">' +
          '<div><span class="who">@' + esc(name) + '</span><span class="who-sub">· trader profile</span></div>' +
          '<span class="brand">HYPERFLEX</span>' +
        '</div>';

      var bio = d.trade_bio ? '<div class="trade-bio">' + esc(d.trade_bio) + '</div>' : '';

      var hero =
        '<div class="hero">' +
          '<div class="score-row">' +
            '<span class="score' + (flexNum==='—'?' mute':'') + '">' + flexNum + '</span>' +
            '<span class="score-lbl">flex score</span>' +
          '</div>' + bio +
        '</div>';

      // ── stat quad
      var winRate = c && c.win_rate_pct != null ? c.win_rate_pct : num(d.prediction_win_rate);
      var nCount  = c && c.n != null ? c.n : num(d.predictions_resolved);
      var roi     = c ? c.realized_roi_pct : null;

      var quad =
        '<div class="quad">' +
          '<div class="q"><div class="q-lbl">CLV grade</div>' +
            '<div class="q-val">' + (grade || '—') + '</div>' +
            '<div class="q-sub">avg ' + cents(d.clv_avg_cents) + '</div></div>' +
          '<div class="q"><div class="q-lbl">win rate</div>' +
            '<div class="q-val">' + pct(winRate, 0) + '</div>' +
            '<div class="q-sub">' + (nCount != null ? 'n = ' + nCount : '—') + '</div></div>' +
          '<div class="q"><div class="q-lbl">realized ROI</div>' +
            '<div class="q-val ' + (roi == null ? '' : (roi >= 0 ? 'pos' : 'neg')) + '">' + signedPct(roi) + '</div>' +
            '<div class="q-sub">' + (c && c.total_staked_usd ? usd(c.total_staked_usd) + ' staked' : 'all time') + '</div></div>' +
          '<div class="q"><div class="q-lbl">wallet class</div>' +
            '<div class="q-val cy">' + (CLASS_LABEL[wc] || '—') + '</div>' +
            '<div class="q-sub">' + (d.clv_sample_size ? 'n = ' + d.clv_sample_size : 'unrated') + '</div></div>' +
        '</div>';

      // ── meta strip
      var stripBits = [];
      if (c && c.avg_hold_days != null) {
        var hd = c.avg_hold_days;
        // Sub-day averages are real (same-session sports books), not a
        // missing value — show "<1d" rather than a bare "0d".
        var hdLabel = hd < 1 ? '&lt;1d' : (hd < 10 ? hd.toFixed(1) : Math.round(hd)) + 'd';
        stripBits.push('Avg hold <b>' + hdLabel + '</b>'
          + (c.avg_hold_known_n != null && c.n && c.avg_hold_known_n < c.n
              ? ' <span style="opacity:.7">(' + c.avg_hold_known_n + ' of ' + c.n + ' timed)</span>' : ''));
      }
      if (c && c.avg_size_usd != null)  stripBits.push('Avg size <b>' + usd(c.avg_size_usd) + '</b>');
      if (c && c.categories && c.categories.length) stripBits.push('Categories <b>' + c.categories.map(esc).join(' · ') + '</b>');
      var strip = stripBits.length ? '<div class="strip">' + stripBits.join(' &nbsp;·&nbsp; ') + '</div>' : '';

      // ── chart
      var chart = '';
      if (c && c.roi_series && c.roi_series.length > 1) {
        chart = '<div class="chart-wrap">' +
          '<div class="chart-head"><span class="chart-lbl">cumulative ROI</span>' +
          '<span class="chart-lbl">' + c.roi_series.length + ' resolved</span></div>' +
          sparkline(c.roi_series) + '</div>';
      }

      // ── how they trade (risk / style disclosure)
      var risk = '';
      if (c && c.risk_profile) {
        var rp = c.risk_profile;
        var soldPct = rp.resolution_style.sold_early_pct;
        var heldPct = rp.resolution_style.held_to_resolution_pct;
        // Resolution-style bar only when there's a real split to show.
        var bar = '';
        if (soldPct + heldPct >= 95) {
          var segs = '';
          if (soldPct > 0) segs += '<div class="risk-seg sold" style="width:' + soldPct + '%">' + (soldPct >= 12 ? soldPct + '% sold early' : '') + '</div>';
          if (heldPct > 0) segs += '<div class="risk-seg held" style="width:' + heldPct + '%">' + (heldPct >= 12 ? heldPct + '% held' : '') + '</div>';
          bar = '<div class="risk-bar">' + segs + '</div>' +
            '<div class="risk-legend">Sold early = exited on a price move before the market resolved. Held = kept to resolution.</div>';
        }
        var flags = (rp.flags || []).map(function(f){
          return '<div class="flag">' +
            '<div class="flag-dot ' + f.severity + '"></div>' +
            '<div><div class="flag-label">' + esc(f.label) + '</div>' +
            '<div class="flag-detail">' + esc(f.detail) + '</div></div>' +
          '</div>';
        }).join('');
        risk = '<div class="risk">' +
          '<div class="risk-head">how they trade</div>' +
          '<div class="risk-style">' + esc(rp.style) + '</div>' +
          bar + flags +
        '</div>';
      }

      // ── resolution ledger
      var ledger = '';
      if (c && c.resolutions && c.resolutions.length) {
        ledger = '<div class="led-head">recent resolutions</div>' + c.resolutions.map(function(r){
          var isWin = r.outcome === 'win', isLoss = r.outcome === 'loss';
          var tagCls = isWin ? 'pos' : (isLoss ? 'neg' : '');
          var tag = isWin ? 'WIN' : (isLoss ? 'LOSS' : 'PUSH');
          var bits = ['<span class="tag ' + tagCls + '">' + tag + '</span>'];
          if (r.staked_usd != null) bits.push(usd(r.staked_usd) + ' staked');
          if (r.entry_price != null) bits.push(price(r.entry_price) + ' → ' + price(r.exit_price));
          if (r.held_days != null) bits.push(r.held_days + 'd held');
          return '<div class="row">' +
            '<div><div class="row-q">' + esc(r.question || '') + '</div>' +
            '<div class="row-meta">' + bits.join(' · ') + '</div></div>' +
            '<div class="row-amt ' + tagCls + '">' + signedUsd(r.pnl_usd) + '</div>' +
          '</div>';
        }).join('');
      }

      var foot =
        '<div class="foot">' +
          '<span>hyperflex.network/p/' + esc(name) + '</span>' +
          '<span>' + (c && c.n != null ? c.n + ' resolved · ' : '') + 'updated live</span>' +
        '</div>';

      // Open-positions slot — filled asynchronously by loadOpenPositions so
      // the live Polymarket fetch never blocks the card paint. Sits above
      // the resolved ledger: what they hold NOW is the actionable part,
      // the resolved history below it is the evidence they're worth copying.
      var openSlot = '<div id="openSlot"></div>';

      document.getElementById('root').innerHTML =
        '<div class="card">' + head + hero + quad + strip + risk + chart + openSlot + ledger + foot + '</div>';

      if (d.polymarket_address) loadOpenPositions(d.polymarket_address);
    }

    // Internal market page keeps the trade on our builder-fee path; falls
    // back to the Polymarket URL when the slug can't be recovered.
    function marketHref(p){
      var m = /polymarket\.com\/event\/([^/?#]+)/.exec(p.market_url || '');
      return m ? '/market/' + m[1] : (p.market_url || 'https://polymarket.com');
    }

    function loadOpenPositions(addr){
      fetch('/api/polymarket/positions/' + encodeURIComponent(addr))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          var slot = document.getElementById('openSlot');
          if (!slot || !d) return;
          var all = (d.positions || d || []);
          if (!Array.isArray(all)) return;
          // Open only — settled rows are already represented, graded, in the
          // resolved ledger below. Biggest first: position size is the
          // trader's own conviction signal and the most useful sort for
          // someone deciding what to follow.
          var open = all.filter(function(p){ return !p.settled; })
                        .sort(function(a,b){ return (b.cost_basis||0) - (a.cost_basis||0); })
                        .slice(0, 8);
          if (!open.length) {
            slot.innerHTML = '<div class="led-head">open positions</div>' +
              '<div class="row"><div class="row-q" style="color:var(--dim);font-weight:400">' +
              'No open positions — nothing live to follow right now.</div></div>';
            return;
          }
          slot.innerHTML =
            '<div class="led-head with-live"><span>open positions</span>' +
            '<span class="open-live">' + open.length + ' live</span></div>' +
            open.map(function(p){
              var pnl = num(p.pnl), pnlPct = num(p.pnl_pct);
              var cls = pnl == null ? '' : (pnl > 0 ? 'pos' : (pnl < 0 ? 'neg' : ''));
              var bits = [];
              if (p.cost_basis) bits.push(usd(p.cost_basis) + ' in');
              if (p.current_price != null) bits.push('now ' + price(p.current_price));
              if (pnlPct != null) bits.push((pnlPct >= 0 ? '+' : '') + pnlPct.toFixed(1) + '%');
              if (p.end_date) {
                var dt = new Date(p.end_date);
                if (!isNaN(dt)) bits.push('ends ' + dt.toLocaleDateString('en-US', { month:'short', day:'numeric' }));
              }
              return '<div class="row">' +
                '<div><div class="row-q">' +
                  '<span class="open-side">' + esc(String(p.side || '').toUpperCase()) + '</span>' +
                  '<a class="row-link" href="' + esc(marketHref(p)) + '">' + esc(p.question || '') + '</a>' +
                '</div>' +
                '<div class="row-meta">' + bits.join(' · ') + '</div></div>' +
                '<div class="row-amt ' + cls + '">' + signedUsd(pnl) + '</div>' +
              '</div>';
            }).join('');
        })
        .catch(function(e){ console.warn('[profile] open positions failed:', e); });
    }

    function notFound(){
      document.getElementById('root').innerHTML =
        '<div class="state"><h2>Trader not found</h2>' +
        '<div>No profile matches this handle. <a href="/predictors" style="color:var(--cyan)">Browse the leaderboard →</a></div></div>';
    }

    const raw = window.location.pathname.split('/').pop();
    const handle = raw.startsWith('@') ? raw.slice(1) : raw;
    if (!handle) { notFound(); return; }

    fetch('/api/user/profile/' + encodeURIComponent(handle))
      .then(function(r){ if (r.status === 404) { notFound(); return null; } return r.json(); })
      .then(function(d){
        if (!d) return;
        if (d.error) { notFound(); return; }
        document.title = (d.handle || d.display_name || 'Trader') + ' — HYPERFLEX';
        try {
          render(d);
        } catch (err) {
          console.error('[profile] render crashed:', err, '\n  on data:', d);
          document.getElementById('root').innerHTML = '<div class="state"><h2>Couldn\'t load profile</h2><div>Try again in a moment.</div></div>';
        }
      })
      .catch(function(err){
        console.error('[profile] fetch/parse failed:', err);
        document.getElementById('root').innerHTML = '<div class="state"><h2>Couldn\'t load profile</h2><div>Try again in a moment.</div></div>';
      });
  })();
  </script>
</body>
</html>
