<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLEX Feed — HYPERFLEX</title>
<link rel="stylesheet" href="/trader-card.css?v=2">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  --paper:#0a0a0f; --card:#121218; --card2:#16161e; --border:#1e1e2a;
  --ink:#f5f5fa; --muted:rgba(240,240,245,.42);
  --gold:#c9920d; --green:#00e68a; --red:#ff4d6a; --cyan:#4d9fff; --purple:#a855f7; --amber:#f59e0b;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  background:
    radial-gradient(ellipse 900px 500px at 15% -8%, rgba(168,85,247,.05), transparent 60%),
    radial-gradient(ellipse 900px 500px at 85% 15%, rgba(0,230,138,.04), transparent 60%),
    var(--paper);
  color: var(--ink);
  min-height: 100vh;
}

#nav-root { position: sticky; top: 0; z-index: 100; }

/* ── mobile-first base: single column, edge-to-edge rows ── */
.page-wrap { padding: 22px 0 80px; }
.page-head { padding: 0 16px; margin-bottom: 22px; }
.page-head h1 { font-size: 22px; font-weight: 900; letter-spacing: -.03em; color: #fff; }
.page-head h1 span { background: linear-gradient(120deg, var(--purple), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.page-sub { font-size: 12.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; max-width: 480px; }
.live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--green); font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-top: 10px; }
.page-stat { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--muted); margin-top: 4px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.85); } }

/* row edge fade — hints there's more to scroll without a visible scrollbar */
.fade-row { position: relative; }
.fade-row::after { content: ''; position: absolute; top: 0; right: 0; bottom: 8px; width: 36px; background: linear-gradient(90deg, transparent, var(--paper)); pointer-events: none; }
@media (min-width: 1024px) { .fade-row::after { display: none; } }

/* ── ANOMALIES ROW (top) ── */
.anom-section { margin-bottom: 32px; }
.anom-head { display: flex; align-items: center; gap: 8px; padding: 0 16px; margin-bottom: 12px; }
.anom-head .live-swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1.6s ease-in-out infinite; }
.anom-head h2 { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
.anom-head .kicker { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.anom-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 10px; scrollbar-width: none; }
.anom-scroll::-webkit-scrollbar { display: none; }
.anom-card {
  flex: 0 0 auto; width: 220px; background: var(--card); border: 1px solid var(--border);
  border-top: 2px solid var(--accent, var(--gold));
  border-radius: 4px 4px 12px 12px; padding: 13px 14px; text-decoration: none; color: var(--ink);
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.anom-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(0,0,0,.5); }
@keyframes flashIn { 0% { box-shadow: 0 0 0 2px var(--accent), 0 0 24px -2px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent; } }
.anom-card.flash { animation: flashIn 3s ease-out; }
@media (prefers-reduced-motion: reduce) { .anom-card.flash { animation: none; } }
.anom-badge-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.anom-badge { font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: .07em; padding: 2px 7px; border-radius: 4px; }
.anom-age { font-family: 'Inter', sans-serif; font-size: 10.5px; color: var(--muted); }
.anom-market { font-size: 12.5px; font-weight: 700; line-height: 1.35; color: #f0f0f5; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.anom-reason { font-size: 11.5px; color: rgba(240,240,245,.6); line-height: 1.4; margin-bottom: 10px; }
.anom-side { display: inline-block; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 4px; }
.anom-side.yes { color: var(--green); background: rgba(0,230,138,.1); }
.anom-side.no  { color: var(--red); background: rgba(255,77,106,.1); }
.anom-empty { padding: 20px 16px; color: var(--muted); font-size: 12.5px; }

/* ── CATEGORY WIN ROWS (score wall) ── */
.cat-row { margin-bottom: 34px; }
.cat-row-head { display: flex; align-items: center; flex-wrap: wrap; row-gap: 6px; gap: 9px; padding: 0 16px; margin-bottom: 12px; }
.cat-row-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent, var(--gold)); flex-shrink: 0; }
.cat-row-head h2 { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
.cat-row-vol { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: var(--muted); background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px; margin-left: auto; }
.cat-row-see { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .12s; }
.cat-row-see:hover { color: var(--ink); }
.win-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 10px; scrollbar-width: none; }
.win-scroll::-webkit-scrollbar { display: none; }
.wcard {
  flex: 0 0 auto; width: 238px; background: linear-gradient(160deg, var(--card2), var(--card));
  border: 1px solid var(--border); border-left: 3px solid var(--accent, var(--gold));
  border-radius: 4px 14px 14px 4px; padding: 16px; text-decoration: none; color: var(--ink);
  display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s, box-shadow .15s;
}
.wcard:hover { transform: translateY(-3px); box-shadow: 0 16px 36px -14px rgba(0,0,0,.55); }
/* ── who traded it comes FIRST — Marc: "the focus is on the roi" (it was),
   name needs to lead. Score+n sits beside the name in a badge, not the
   avatar-initials circle (Marc: "the score should be a number instead
   of having an image with the first two letters... put the score there
   and make it pop") — the badge IS the identity mark now: colored,
   bordered, bold, same tinted-pill treatment as the hero card's
   scoreline. n rides along inside the badge, small — still never
   rendered without it (rule 3), just no longer flat muted text. ── */
.wcard-who { display: flex; align-items: center; gap: 8px; }
/* ── Flex Score badge (2026-08-05) — same hero treatment as trader-card.js's
   .tcard-flexhero and home-kings.html's category board: gold, prominent,
   the number the eye lands on first. Replaces the old raw-ROI% pill. ── */
.wcard-flexbadge { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px 9px; border-radius: 8px; flex-shrink: 0; min-width: 54px; background: rgba(201,146,13,.14); border: 1px solid rgba(201,146,13,.35); }
.wcard-flexbadge .num { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 800; line-height: 1.1; color: var(--gold); white-space: nowrap; }
.wcard-flexbadge.is-mute .num { color: var(--muted); }
.wcard-flexbadge .lbl { font-family: 'Inter', sans-serif; font-size: 7.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; line-height: 1.1; }
/* ── supporting stat row — win rate / ROI / trade count, small and muted,
   underneath the Flex Score badge. ── */
.wcard-substats { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ── legacy score+n badge — no longer emitted by winCardHtml(), kept in
   case anything else still references it. Safe to delete once confirmed
   unused. ── */
.wcard-score-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px 9px; border-radius: 8px; flex-shrink: 0; min-width: 54px; }
.wcard-score-badge.positive { background: rgba(0,230,138,.14); border: 1px solid rgba(0,230,138,.35); }
.wcard-score-badge.negative { background: rgba(255,77,106,.12); border: 1px solid rgba(255,77,106,.32); }
.wcard-score-badge .pct { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
.wcard-score-badge.positive .pct { color: var(--green); }
.wcard-score-badge.negative .pct { color: var(--red); }
.wcard-score-badge .nn { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 600; color: var(--muted); line-height: 1.1; }
.wcard-handle { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.wcard-hero { display: flex; align-items: baseline; gap: 6px; }
.wcard-hero .won-label { font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.wcard-hero .mult { font-size: 19px; font-weight: 900; letter-spacing: -.02em; color: var(--green); font-variant-numeric: tabular-nums; }
.wcard-entry { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; color: var(--muted); }
.wcard-q { font-size: 12px; color: rgba(240,240,245,.72); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 33px; margin-top: auto; }

.empty-state { padding: 24px 16px; color: var(--muted); font-size: 12.5px; }

/* ── desktop scale-up (>=1024px) ── */
@media (min-width: 1024px) {
  .page-wrap { max-width: 1240px; margin: 0 auto; padding: 36px 0 88px; }
  .page-head, .anom-head, .cat-row-head, .anom-scroll, .win-scroll, .anom-empty, .empty-state { padding-left: 32px; padding-right: 32px; }
  .page-head h1 { font-size: 28px; }
  .anom-card { width: 250px; }
  .wcard { width: 254px; }
  .wcard-handle { font-size: 16px; }
  .wcard-hero .mult { font-size: 22px; }
}
</style>
</head>
<body>

<div id="nav-root"></div>
<script src="/nav.js?v=28"></script>

<div class="page-wrap">

  <div class="page-head">
    <h1>FLEX <span>Feed</span></h1>
    <p class="page-sub">Live whale activity, and the largest verified wins on the durable board — grouped by category, most-traded first.</p>
    <div class="live-badge"><div class="live-dot"></div><span id="live-count">live</span></div>
    <div class="page-stat" id="pageStat"></div>
  </div>

  <div class="anom-section">
    <div class="anom-head"><span class="live-swatch"></span><h2>Live Feed</h2></div>
    <div class="anom-scroll fade-row" id="anomScroll"></div>
  </div>

  <div id="catRows"></div>

</div>

<script src="/trader-card.js?v=2"></script>
<script>
'use strict';

function esc(s) { return HFXTraderCard.esc(s); }

function fmtUsd(n) {
  if (n == null) return '—';
  var v = Math.abs(n);
  var s = v >= 1e6 ? '$' + (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? '$' + Math.round(v / 1e3) + 'K' : '$' + Math.round(v);
  return (n < 0 ? '-' : '') + s;
}
function fmtPct(p) { if (p == null) return '—'; return (p >= 0 ? '+' : '') + p.toFixed(1) + '%'; }
function fmtPlainPct(p) { if (p == null) return '—'; return p.toFixed(1) + '%'; }
function tAgo(ts) {
  if (!ts) return '';
  var ms = Date.now() - new Date(ts).getTime();
  if (ms < 60000) return 'now';
  if (ms < 3600000) return Math.floor(ms / 60000) + 'm';
  if (ms < 86400000) return Math.floor(ms / 3600000) + 'h';
  return Math.floor(ms / 86400000) + 'd';
}
function handleOf(c) {
  if (c.username) return '@' + c.username;
  if (c.display_name) return c.display_name;
  if (c.polymarket_address) return c.polymarket_address.slice(0, 6) + '…' + c.polymarket_address.slice(-4);
  return 'Trader';
}

// One accent per category — quick visual scanning as you scroll past rows.
var CAT_COLORS = {
  world: '#a855f7', politics: '#4d9fff', macro: '#c9920d', sports: '#00e68a',
  crypto: '#f59e0b', commodities: '#d97706', tech: '#38bdf8', entertainment: '#ff4d6a', weather: '#6b7280',
};

// ── LIVE FEED: reuse /api/signals — the existing whale-cluster / momentum /
// volume-surge / new-entry detectors (Alpha Engine; cross-platform arbitrage
// was removed 2026-05-10 when Kalshi was dropped, so that type never fires
// here and isn't in the map below). No score or hit-rate number is shown
// (that's gated separately) — just the raw, observable fact, PLUS a plain
// reason line built from that signal's own real fields (whale_count,
// consensus_pct, change_pct, etc.) so it's never just a badge with no
// explanation of why the market is on the list. ──
var ANOM_COLORS = { whale_cluster: ['rgba(168,85,247,.12)', '#a855f7'], momentum: ['rgba(77,159,255,.12)', '#4d9fff'], volume_surge: ['rgba(255,77,106,.12)', '#ff4d6a'], new_entry: ['rgba(0,230,138,.12)', '#00e68a'] };
var ANOM_LABELS = { whale_cluster: 'WHALE CLUSTER', momentum: 'MOMENTUM', volume_surge: 'VOLUME SURGE', new_entry: 'NEW ENTRY' };

function reasonFor(s) {
  if (s.type === 'whale_cluster') {
    var pct = s.consensus_pct != null ? ' · ' + Math.round(s.consensus_pct) + '% consensus' : '';
    return (s.whale_count || 0) + ' whales on ' + (s.side || 'one side') + pct;
  }
  if (s.type === 'momentum') {
    var from = s.start_price != null ? s.start_price + '¢' : '?';
    var to = s.odds_price != null ? s.odds_price + '¢' : '?';
    return 'Odds moved ' + from + ' → ' + to + ' in 24h';
  }
  if (s.type === 'new_entry') {
    return 'New ' + (s.capital ? fmtUsd(s.capital) + ' ' : '') + (s.side || '') + ' position just opened';
  }
  if (s.type === 'volume_surge') {
    return s.action || 'Unusual activity detected';
  }
  return s.action || '';
}

function renderAnomEmpty() {
  document.getElementById('anomScroll').innerHTML = '<div class="anom-empty">Nothing live right now — check back shortly.</div>';
}
function signalKey(s) { return s.type + '|' + s.market + '|' + s.detected_at; }

// Seeded on the first successful load (so the initial 10 cards don't all
// flash at once) — only signals that appear on a LATER poll and weren't in
// the previous set get the flash treatment, i.e. "new since you were last
// looking at this page," same idea as the old ticker's leader-change flash.
var _anomSeenKeys = null;
function loadAnomalies() {
  fetch('/api/signals')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      var list = ((d && (d.signals || d)) || []).slice(0, 10);
      if (!list.length) { renderAnomEmpty(); return; }
      var prevKeys = _anomSeenKeys;
      document.getElementById('anomScroll').innerHTML = list.map(function(s) {
        var colors = ANOM_COLORS[s.type] || ['rgba(201,146,13,.12)', '#c9920d'];
        var label = ANOM_LABELS[s.type] || String(s.type || '').toUpperCase();
        var side = (s.side || '').toUpperCase();
        var url = s.slug ? '/market/' + esc(s.slug) : '#';
        var isNew = prevKeys && !prevKeys.has(signalKey(s));
        return '<a class="anom-card' + (isNew ? ' flash' : '') + '" style="--accent:' + colors[1] + '" href="' + url + '">'
          + '<div class="anom-badge-row"><span class="anom-badge" style="background:' + colors[0] + ';color:' + colors[1] + '">' + esc(label) + '</span><span class="anom-age">' + esc(tAgo(s.detected_at)) + '</span></div>'
          + '<div class="anom-market">' + esc(s.market || '') + '</div>'
          + '<div class="anom-reason">' + esc(reasonFor(s)) + '</div>'
          + (side ? '<span class="anom-side ' + (side === 'YES' ? 'yes' : 'no') + '">' + esc(side) + '</span>' : '')
          + '</a>';
      }).join('');
      _anomSeenKeys = new Set(list.map(signalKey));
    })
    .catch(renderAnomEmpty);
}

// ── CATEGORY WIN ROWS: /api/feed/category-wins, most-liquid category first,
// each row a scrolling wall of real winning trades. Score+n always travel
// with the win (rule 3) — never a naked win rate. ──
function winCardHtml(e, accent) {
  var handle = handleOf(e);
  var win = e.win;
  var verb = win.side === 'SELL' ? 'Sold' : 'Bought';
  var entryC = win.entry_price != null ? Math.round(win.entry_price * 100) + '¢' : null;
  var multText = win.multiplier != null ? win.multiplier + 'x' : fmtPct(win.roi_pct);
  var flexKnown = e.flex_score != null;
  var flexText = flexKnown ? String(e.flex_score) : '—';
  // Canonical trader profile is /@handle, not /trader/<uuid> — same bug
  // and same fix as trader-card.js's HFXTraderCard.render() (this card
  // markup is a separate implementation, doesn't route through that
  // shared component, so it needed the identical fix applied here too).
  var href = e.username ? '/@' + esc(e.username) : e.polymarket_address ? '/trader/' + esc(e.polymarket_address) : '#';
  // Same Flex Score hero treatment as every other card on the homepage/feed
  // (2026-08-05): gold, prominent badge is the hero; win rate/ROI/trade
  // count are the smaller supporting row directly beneath. The specific win
  // (mult/entry/question) is this card's own evidence — kept as-is below.
  return '<a class="wcard" style="--accent:' + accent + '" href="' + href + '">'
    + '<div class="wcard-who">'
      + '<div class="wcard-flexbadge' + (flexKnown ? '' : ' is-mute') + '"><span class="num">' + esc(flexText) + '</span><span class="lbl">Flex</span></div>'
      + '<div class="wcard-handle">' + esc(handle) + '</div>'
    + '</div>'
    + '<div class="wcard-substats">' + esc(fmtPlainPct(e.win_rate_pct)) + ' WR · ' + esc(fmtPct(e.raw_weighted_roi_pct)) + ' ROI · ' + esc(e.n) + ' trades</div>'
    + '<div class="wcard-hero"><span class="won-label">Won</span><span class="mult">' + esc(multText) + '</span></div>'
    + '<div class="wcard-entry">' + esc(verb) + (entryC ? ' at ' + entryC : '') + '</div>'
    + '<div class="wcard-q">' + esc((win.question || '').slice(0, 80)) + '</div>'
    + '</a>';
}

function loadCategoryRows() {
  var wrap = document.getElementById('catRows');
  fetch('/api/feed/category-wins?limit=16')
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      var cats = (d && d.categories) || [];
      if (!cats.length) { wrap.innerHTML = '<div class="empty-state">No category has enough verified wins yet to show a wall.</div>'; return; }
      var stat = document.getElementById('pageStat');
      if (stat) {
        var totalVol = cats.reduce(function(s, c) { return s + (c.total_volume_usd || 0); }, 0);
        stat.textContent = fmtUsd(totalVol) + ' tracked across ' + cats.length + ' categor' + (cats.length === 1 ? 'y' : 'ies');
      }
      wrap.innerHTML = cats.map(function(c) {
        var accent = CAT_COLORS[c.category] || '#c9920d';
        return '<div class="cat-row">'
          + '<div class="cat-row-head"><span class="dot" style="--accent:' + accent + '"></span><h2>' + esc(c.label) + '</h2><span class="cat-row-vol">' + esc(fmtUsd(c.total_volume_usd)) + ' tracked</span><a class="cat-row-see" href="/traders?category=' + esc(c.category) + '">See all →</a></div>'
          + '<div class="win-scroll fade-row">' + c.entries.map(function(e) { return winCardHtml(e, accent); }).join('') + '</div>'
          + '</div>';
      }).join('');
    })
    .catch(function() { wrap.innerHTML = '<div class="empty-state">Could not load the category feed. <a href="javascript:void 0" onclick="loadCategoryRows();return false" style="color:#a78bfa">retry</a></div>'; });
}

document.addEventListener('DOMContentLoaded', function() {
  loadAnomalies();
  loadCategoryRows();
  setInterval(loadAnomalies, 2 * 60 * 1000);
  // Category wins change less often than live signals (a new qualifying
  // win is a rarer event than a whale position), so a longer interval here
  // is enough to keep "Live Feed" honest without hammering the endpoint.
  setInterval(loadCategoryRows, 3 * 60 * 1000);
});
</script>
</body>
</html>
