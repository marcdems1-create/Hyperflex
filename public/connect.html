<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect — HYPERFLEX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/trader-card.css?v=3">
<style>
  :root{
    --gold:#c9920d; --green:#00e68a; --red:#ff4d6a; --blue:#4d9fff; --purple:#a855f7; --amber:#f59e0b;
    /* --muted lifted .45 -> .62 (2026-07-29): at .45 every label, scope
       line, and disclosure on the page sat near the low end of readable on
       a #0e0e15 background, which made the whole surface read as washed
       out regardless of type size. Contrast was doing as much damage as
       scale. --border lifted similarly so section edges actually register. */
    --paper:#0e0e15; --ink:#f0f0f5; --border:#26263a; --muted:rgba(240,240,245,.62);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;}
  #nav-root{position:sticky;top:0;z-index:100;}

  main{max-width:760px;margin:0 auto;padding:0 24px 80px;}

  /* ── hero: connect ── */
  .hero{text-align:center;padding:56px 0 36px;}
  .hero h1{font-size:34px;font-weight:900;letter-spacing:-.02em;margin:0 0 12px;}
  .hero p{font-size:15px;color:var(--muted);max-width:480px;margin:0 auto 28px;line-height:1.5;}
  .connect-btn{font-family:'Inter',sans-serif;font-size:15px;font-weight:800;color:#0e0e15;background:linear-gradient(135deg,#00e68a,#4d9fff);border:none;border-radius:10px;padding:14px 28px;cursor:pointer;}
  .connect-btn:hover{filter:brightness(1.08);}
  .connect-btn:disabled{opacity:.5;cursor:default;filter:none;}
  .connect-alt{margin-top:22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .connect-alt input{font-family:'JetBrains Mono',monospace;font-size:13px;background:#111118;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:10px 14px;width:340px;max-width:100%;}
  .connect-alt button{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:10px 14px;cursor:pointer;}
  .connect-alt button:hover{color:var(--ink);border-color:rgba(240,240,245,.3);}
  .connect-err{color:var(--red);font-size:13px;margin-top:14px;}

  /* ── desktop hero scale (>=1024px) — mobile below this breakpoint is
     untouched. Fixes the front door rendering as a tiny cluster on wide
     viewports: #pageMain centers the hero vertically in the remaining
     viewport height (below the sticky nav) until a connect is in flight —
     JS adds .is-active to #pageMain at that point so the page reverts to
     normal top-down flow once there's real content to read top-to-bottom. ── */
  @media (min-width: 1024px) {
    main { max-width: 1120px; }
    #pageMain {
      min-height: calc(100vh - 116px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #pageMain.is-active {
      min-height: 0;
      justify-content: flex-start;
      padding-top: 40px;
    }
    .hero h1 { font-size: 108px; }
    .hero p { font-size: 34px; max-width: 860px; }
    .connect-btn { min-width: 480px; font-size: 40px; padding: 40px 88px; }
    .connect-alt { margin-top: 40px; }
    .connect-alt input { font-size: 32px; width: 800px; padding: 30px 36px; }
    .connect-alt button { font-size: 30px; padding: 30px 36px; }
  }

  /* ── listing notice ── */
  .listing-notice{display:flex;align-items:flex-start;gap:14px;background:#111118;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:20px;font-size:13px;line-height:1.5;color:rgba(240,240,245,.8);}
  .listing-notice label{display:flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);white-space:nowrap;flex-shrink:0;margin-left:auto;cursor:pointer;}
  .listing-notice input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;}

  /* ── progress banner while the verified backfill runs ── */
  .verify-banner{display:flex;align-items:center;gap:10px;background:rgba(77,159,255,.08);border:1px solid rgba(77,159,255,.22);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-family:'Inter',sans-serif;font-size:12.5px;color:#4d9fff;}
  .verify-spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(77,159,255,.25);border-top-color:#4d9fff;animation:spin .8s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── raw record (shown before verification completes) ── */
  .raw-card{background:#111118;border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px;}
  .raw-identity{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .raw-avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:16px;font-weight:800;color:#0e0e15;}
  .raw-addr{font-family:'JetBrains Mono',monospace;font-size:14px;color:rgba(240,240,245,.75);}
  .raw-stats{font-size:14px;color:rgba(240,240,245,.7);line-height:1.6;}
  .raw-stats b{color:#fff;}

  /* ── non-qualifying progress (progress bar, not a rejection) ── */
  .qual-progress{margin-top:14px;}
  .qual-bar-track{width:100%;height:8px;border-radius:5px;background:rgba(240,240,245,.08);overflow:hidden;margin-top:8px;}
  .qual-bar-fill{height:100%;background:linear-gradient(90deg,#4d9fff,#00e68a);border-radius:5px;transition:width .4s ease;}
  .qual-note{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);margin-top:8px;}

  .category-stub{background:#111118;border:1px dashed var(--border);border-radius:10px;padding:18px;margin-top:20px;font-size:13px;color:var(--muted);line-height:1.6;}
  .category-stub a{color:var(--blue);text-decoration:none;}
  .category-stub a:hover{text-decoration:underline;}

  /* ── category browse: rule 4's "never a dead end" for non-qualifying
     wallets — real live markets, grouped by topic, so there's an actual
     next action instead of a paragraph pointing at the leaderboard. ── */
  .cat-browse{margin-top:20px;}
  .cat-browse-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .cat-browse-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
  .cat-browse-hint{font-size:13px;color:#4d9fff;background:rgba(77,159,255,.08);border:1px solid rgba(77,159,255,.2);border-radius:10px;padding:12px 16px;margin-bottom:14px;line-height:1.5;}
  .cat-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none;}
  .cat-chips::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#111118;border:1px solid var(--border);border-radius:20px;padding:7px 14px;cursor:pointer;white-space:nowrap;transition:color .12s,border-color .12s,background .12s;}
  .cat-chip:hover{color:var(--ink);border-color:rgba(240,240,245,.3);}
  .cat-chip.active{color:#0e0e15;background:#fff;border-color:#fff;}
  .cat-market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .cat-market-card{display:block;background:#111118;border:1px solid var(--border);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s;}
  .cat-market-card:hover{border-color:rgba(240,240,245,.3);transform:translateY(-2px);}
  .cmc-img{height:84px;background-size:cover;background-position:center;background-color:#1a1a22;}
  .cmc-body{padding:10px 12px;}
  .cmc-why{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);margin-bottom:6px;}
  .cmc-why.is-positive{color:var(--green);}
  .cmc-why.is-negative{color:var(--red);}
  .cmc-why.is-warn{color:var(--amber);}
  .cmc-q{font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px;}
  .cmc-meta{display:flex;justify-content:space-between;align-items:center;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);}
  .cmc-price{font-weight:700;color:var(--green);}

  .empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .skel{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.6s infinite;border-radius:10px;height:80px;}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ── verified record (identical to /trader/:handle — same rendering code, see comment in JS) ── */
  .p-header{padding:8px 0 28px;}
  .p-identity{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .p-avatar{width:56px;height:56px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:#0e0e15;}
  .p-handle{font-family:'Inter',sans-serif;font-weight:600;font-size:17px;color:rgba(240,240,245,.85);}
  .p-address{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;margin-top:2px;background:none;border:none;padding:0;}
  .p-address:hover{color:var(--ink);}
  .p-rank{margin-left:auto;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
  .p-profile-link{margin-left:auto;flex-shrink:0;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none;white-space:nowrap;}
  .p-profile-link:hover{text-decoration:underline;}

  .p-verdict{font-size:30px;font-weight:900;line-height:1.18;letter-spacing:-.015em;color:#fff;margin-bottom:20px;}
  .p-verdict.is-ineligible{color:rgba(240,240,245,.55);font-weight:700;font-size:22px;}

  .p-scoreline{display:inline-flex;align-items:baseline;gap:10px;padding:12px 20px;border-radius:10px;font-family:'JetBrains Mono',monospace;}
  .p-scoreline.is-positive{background:rgba(0,230,138,.09);border:1px solid rgba(0,230,138,.25);}
  .p-scoreline.is-negative{background:rgba(255,77,106,.08);border:1px solid rgba(255,77,106,.22);}
  .p-scoreline.is-neutral{background:rgba(240,240,245,.05);border:1px solid rgba(240,240,245,.12);}
  .p-score{font-size:28px;font-weight:800;}
  .p-scoreline.is-positive .p-score{color:#00e68a;}
  .p-scoreline.is-negative .p-score{color:#ff4d6a;}
  .p-scoreline.is-neutral .p-score{color:rgba(240,240,245,.6);}
  .p-n{font-size:14px;color:rgba(240,240,245,.4);}
  .p-scope{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);margin-top:10px;}

  .p-scoreline.is-provisional{border-style:dashed;}
  .p-provisional-label{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:#f59e0b;margin-top:10px;margin-bottom:16px;}

  .p-section{margin-top:36px;}
  .p-section-title{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 16px;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
  .stat-tile{background:#111118;border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .stat-label{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:#fff;}
  .stat-value.is-positive{color:#00e68a;}
  .stat-value.is-negative{color:#ff4d6a;}

  .call-pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:700px){ .call-pair{grid-template-columns:1fr;} }
  .call-card{background:#111118;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;}
  .call-card.is-best{border:1px solid rgba(0,230,138,.25);}
  .call-card.is-worst{border:1px solid rgba(255,77,106,.22);}
  .call-kicker{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .call-card.is-best .call-kicker{color:#00e68a;}
  .call-card.is-worst .call-kicker{color:#ff4d6a;}
  .call-q{font-size:16px;font-weight:700;line-height:1.4;color:#f0f0f5;}
  .call-meta{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;}
  .call-meta .amt{margin-left:8px;}
  .call-date{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);}

  .specialty-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .specialty-tile{background:#111118;border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .sim-context{font-size:14px;color:rgba(240,240,245,.8);line-height:1.6;margin:-4px 0 16px;}
  .sim-context b{color:var(--ink);}
  .sim-context .is-positive{color:var(--green);font-weight:700;}
  .sim-context .is-negative{color:var(--red);font-weight:700;}
  .similar-list{display:flex;flex-direction:column;gap:10px;}
  .sim-row{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#111118;border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .sim-main{min-width:0;}
  .sim-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .sim-name{font-size:17px;font-weight:700;color:var(--ink);}
  a.sim-name:hover{color:#4d9fff;text-decoration:underline;}
  .sim-sim{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);}
  .sim-compare{font-size:13.5px;color:rgba(240,240,245,.82);margin-top:7px;line-height:1.55;}
  .sim-compare b{color:var(--ink);}
  .sim-scope{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-top:6px;}
  .sim-edge{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800;white-space:nowrap;text-align:right;}
  .sim-edge small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
  .sim-edge-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  /* Thin-confidence matches (min shared-category n 5-14): the edge number is
     still shown, but never as the loud hero a strong/moderate match gets —
     smaller, muted, with the sample size called out right beside it rather
     than buried in scope_label text below the fold. */
  .sim-edge.is-thin{font-size:16px;font-weight:700;color:var(--muted);}
  .sim-edge.is-thin small{color:var(--muted);}
  .sim-sample-tag{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);background:rgba(240,240,245,.06);border:1px solid var(--border);border-radius:5px;padding:2px 7px;white-space:nowrap;}
  @media(max-width:640px){.sim-row{flex-direction:column;align-items:flex-start;gap:10px;}.sim-edge{text-align:left;}.sim-edge-wrap{align-items:flex-start;}}
  .specialty-cat{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
  .specialty-wr{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;}
  .specialty-wr.is-positive{color:#00e68a;}
  .specialty-wr.is-negative{color:#ff4d6a;}
  .specialty-n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px;}
  /* A 1-4 trade "specialty" is real activity but not evidence of skill —
     mute the tile so it doesn't read with the same authority as a n>=5 one. */
  .specialty-tile.is-small-sample{opacity:.5;}
  .specialty-small-tag{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:5px;}

  .form-row{display:flex;align-items:center;gap:16px;background:#111118;border:1px solid var(--border);border-radius:10px;padding:18px 20px;}
  .form-trend{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;color:var(--muted);}
  .form-trend.up{color:#00e68a;} .form-trend.down{color:#ff4d6a;}

  .hist-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .hist-filters select,.hist-filters button{font-family:'Inter',sans-serif;font-size:12.5px;background:#111118;border:1px solid var(--border);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;}
  .hist-filters button.active{border-color:var(--blue);color:var(--blue);}

  .hist-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
  .hist-table th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--border);}
  .hist-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top;}
  .hist-table tr:last-child td{border-bottom:none;}
  .hist-q{max-width:360px;color:rgba(240,240,245,.8);font-family:'Inter',sans-serif;font-size:13px;}
  .hist-result{font-weight:700;}
  .hist-result.win{color:#00e68a;} .hist-result.loss{color:#ff4d6a;} .hist-result.push{color:var(--muted);}
  .hist-count{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-bottom:10px;}

  .open-list{display:flex;flex-direction:column;gap:8px;}
  .open-row{display:flex;justify-content:space-between;gap:14px;background:#111118;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;}
  .open-row .oq{color:rgba(240,240,245,.75);}
  .open-row .os{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);flex-shrink:0;}

  .void-note{font-size:12px;color:var(--muted);line-height:1.6;max-width:760px;}

  /* ── equity curve ── */
  .curve-card{background:#111118;border:1px solid var(--border);border-radius:12px;padding:22px 24px 14px;margin-top:24px;}
  .curve-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  .curve-title{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .curve-now{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800;}
  .curve-now.is-positive{color:var(--green);} .curve-now.is-negative{color:var(--red);}
  .curve-sub{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-top:4px;}
  svg.curve{width:100%;height:180px;display:block;margin-top:8px;overflow:visible;}

  /* ── desktop scale-up on body content (>=1024px). Round 2, 2026-07-28:
     the exact values from round 1 (34px verdict, 44px score, etc.) were
     confirmed live and correctly applied via Playwright, but read as small
     next to the 108px hero once actually seen in production — a proportion
     call, not a bug. This round is a ~1.4x proportional scale-up over
     round 1's values, a speculative guess same as every prior sizing
     round, done because Marc chose "try again" over "wait for the
     designer." Hero stays as previously sized (untouched here). Mobile
     (<1024px) untouched. Deliberately placed as the LAST rules in this
     stylesheet: every class touched here has its base (mobile) rule
     defined earlier in this file, and an early media query loses the
     cascade to a later unconditional rule at equal specificity — exactly
     the nav.js bug found earlier this session. Being last is what
     guarantees these actually win. ── */
  @media (min-width: 1024px) {
    .p-verdict { font-size: 48px; }
    .p-score { font-size: 64px; }
    .p-n { font-size: 26px; }

    .stat-tile { padding: 28px 32px; }
    .stat-value { font-size: 46px; }
    .stat-label { font-size: 20px; }

    .call-q { font-size: 28px; }
    .call-meta { font-size: 24px; }
    .call-date { font-size: 19px; }

    .specialty-cat { font-size: 22px; }
    .specialty-wr { font-size: 40px; }
    .specialty-n { font-size: 19px; }

    .hist-table th { font-size: 20px; }
    .hist-table td { font-size: 22px; }
    .hist-q { font-size: 22px; }

    .p-section-title { font-size: 28px; }
    .p-section { margin-top: 96px; }

    /* Similar-trader matcher — added 2026-07-29. Every other block in this
       stylesheet has a desktop entry here; without one this section renders
       at mobile sizes next to 46px stat tiles and reads as a footnote,
       which is backwards: it's the only section on the page that isn't a
       restatement of what Polymarket already shows you. */
    .sim-row { padding: 30px 34px; gap: 36px; }
    .sim-name { font-size: 32px; }
    .sim-sim { font-size: 19px; }
    .sim-compare { font-size: 25px; margin-top: 14px; }
    .sim-scope { font-size: 18px; margin-top: 12px; }
    .sim-edge { font-size: 52px; }
    .sim-edge small { font-size: 17px; margin-top: 6px; }
    .sim-edge.is-thin { font-size: 26px; }
    .sim-sample-tag { font-size: 15px; padding: 3px 10px; }

    .open-row .os { font-size: 21px; }

</style>

<body>

<div id="nav-root"></div>
<script src="/nav.js?v=29"></script>

<main id="pageMain">
  <div class="hero" id="hero">
    <h1>What's your score?</h1>
    <p>Connect your wallet to see your real Polymarket trading record — wins and losses, graded against what actually happened.</p>
    <button class="connect-btn" id="connectBtn">Connect Wallet</button>
    <div class="connect-alt">
      <input type="text" id="pasteAddr" placeholder="or paste a wallet address to preview" autocomplete="off">
      <button id="pasteBtn">Preview</button>
    </div>
    <div class="connect-err" id="connectErr" style="display:none;"></div>
  </div>
  <div id="result"></div>
</main>

<script src="/trader-card.js?v=3"></script>
<script>
// ── shared formatting helpers — identical to trader-profile.html by design.
// Duplicated rather than extracted into a shared module for now (same
// tradeoff already made between market.html/creator-dashboard.html
// elsewhere in this codebase — see CLAUDE.md's "KNOWN duplication" note).
// If this drifts from trader-profile.html's version, that's the signal to
// finally extract both into one file.
function esc(s){ return HFXTraderCard.esc(s); }
function fmtPct(p){ if (p==null) return '—'; return (p>=0?'+':'') + p.toFixed(1) + '%'; }
function fmtUsd(n){ if (n==null) return '—'; var v=Math.abs(n); var s=v>=1e6?'$'+(v/1e6).toFixed(1)+'M':v>=1e3?'$'+Math.round(v/1e3)+'K':'$'+Math.round(v); return (n<0?'-':'') + s; }
function fmtDate(d){ if(!d) return '—'; var dt=new Date(d); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function initials(p){
  var src = p.display_name || p.username || p.polymarket_address || p.address || '?';
  var parts = String(src).replace(/^0x/,'').trim().split(/\s+/);
  return (parts.length>=2 ? (parts[0][0]+parts[1][0]) : String(src).slice(0,2)).toUpperCase();
}
function avatarColor(seed){
  var src = String(seed || 'x');
  var hash = 0;
  for (var i=0;i<src.length;i++) hash = (hash*31 + src.charCodeAt(i)) >>> 0;
  return 'hsl(' + (hash % 360) + ', 62%, 62%)';
}
function callLine(call){
  if (!call) return null;
  var verb = call.side === 'SELL' ? 'Sold' : 'Bought';
  var entryC = call.entry_price != null ? Math.round(call.entry_price*100)+'¢' : null;
  var outcome = call.result === 'win' ? 'WON' : call.result === 'loss' ? 'LOST' : 'PUSHED';
  var pctText = call.roi != null ? fmtPct(call.roi*100) : '';
  return (entryC ? verb + ' at ' + entryC + ' ' : verb + ' ') + '→ ' + outcome + (pctText ? ' <span class="amt">' + pctText + '</span>' : '');
}
function callCardHtml(call, kind){
  var label = kind === 'best' ? 'Best call' : 'Worst call';
  if (!call) {
    return '<div class="call-card is-'+kind+'"><div class="call-kicker">'+label+'</div><div class="hist-count">No resolved trades yet.</div></div>';
  }
  var line = callLine(call);
  return '<div class="call-card is-'+kind+'">'
    + '<div class="call-kicker">'+label+(call.result==='loss'&&kind==='best'?' (still a loss)':'')+(call.result==='win'&&kind==='worst'?' (still a win)':'')+'</div>'
    + '<div class="call-q">'+esc((call.question||'').slice(0,140))+'</div>'
    + '<div class="call-meta" style="color:'+(call.pnl>=0?'#00e68a':'#ff4d6a')+'">'+line+'</div>'
    + '<div class="call-date">'+esc(fmtDate(call.closed_at))+' · '+esc(fmtUsd(call.pnl))+'</div>'
  + '</div>';
}

// ── connect state ──
var _pollTimer = null;
var _currentUserId = null;
var _currentAddress = null;
var _hasSigner = false; // true only when the address came from an actual wallet connect, not a pasted preview

// ── remembered wallet — so a returning visitor sees their score immediately
// instead of clicking "Connect Wallet" and re-granting MetaMask every time.
// Two sources feed this, live wallet wins over the cache: eth_accounts is a
// SILENT check (no popup) that only returns an address if this site was
// already granted permission in a prior visit — MetaMask persists that
// grant itself, we just need to ask instead of only reacting to a click.
var CONNECT_CACHE_USERID = 'hf_connect_user_id';
var CONNECT_CACHE_ADDR   = 'hf_connect_address';
var CONNECT_CACHE_SIGNER = 'hf_connect_has_signer';
var CONNECT_CACHE_TS     = 'hf_connect_last_full_ts';
var FULL_REFRESH_INTERVAL_MS = 15 * 60 * 1000; // don't re-run the full activity fetch + backfill more than once per 15 min per visit

function saveConnectCache(userId, address, hasSigner){
  try {
    localStorage.setItem(CONNECT_CACHE_USERID, userId);
    localStorage.setItem(CONNECT_CACHE_ADDR, address);
    localStorage.setItem(CONNECT_CACHE_SIGNER, hasSigner ? '1' : '0');
    localStorage.setItem(CONNECT_CACHE_TS, String(Date.now()));
    // nav.js (loaded on every other page) keeps its own independent
    // "connected wallet" key and only checks it against a live MetaMask
    // eth_accounts call as a fallback — cross-writing here means the nav
    // pill reflects a connection made on THIS page immediately, on the
    // very next page load, instead of only after its own separate silent
    // check happens to run. Real wallet connections only (hasSigner), not
    // pasted-address previews.
    if (hasSigner) localStorage.setItem('hfx_wallet_address', address);
  } catch (e) {}
}
function readConnectCache(){
  try {
    var userId = localStorage.getItem(CONNECT_CACHE_USERID);
    var address = localStorage.getItem(CONNECT_CACHE_ADDR);
    if (!userId || !address) return null;
    return {
      userId: userId,
      address: address,
      hasSigner: localStorage.getItem(CONNECT_CACHE_SIGNER) === '1',
      lastFullTs: parseInt(localStorage.getItem(CONNECT_CACHE_TS) || '0', 10),
    };
  } catch (e) { return null; }
}
function clearConnectCache(){
  try {
    localStorage.removeItem(CONNECT_CACHE_USERID);
    localStorage.removeItem(CONNECT_CACHE_ADDR);
    localStorage.removeItem(CONNECT_CACHE_SIGNER);
    localStorage.removeItem(CONNECT_CACHE_TS);
  } catch (e) {}
}

function showErr(msg){
  var e = document.getElementById('connectErr');
  e.textContent = msg;
  e.style.display = 'block';
}

// A regular mobile browser tab never gets window.ethereum injected — only
// MetaMask's OWN in-app browser does. Without this, a mobile user who
// already has the app hits the same dead end as someone with no wallet at
// all. Deep link opens the app and reloads this exact page inside its
// in-app browser, where window.ethereum IS injected — matches the pattern
// most web3 sites use (docs.metamask.io/wallet/how-to/use-deep-links).
function _isMobileDevice(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }
function _deepLinkToMetaMask(){ location.href = 'https://metamask.app.link/dapp/' + location.host + location.pathname + location.search; }

async function connectWallet(){
  if (!window.ethereum) {
    if (_isMobileDevice()) { _deepLinkToMetaMask(); return; }
    showErr('No wallet extension detected in this browser. Paste an address below to preview instead.');
    return;
  }
  try {
    var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    if (accounts && accounts[0]) { _hasSigner = true; handleAddress(accounts[0]); }
  } catch (e) {
    showErr('Wallet connection was rejected.');
  }
}

function previewAddress(){
  var v = (document.getElementById('pasteAddr').value || '').trim();
  if (!/^0x[0-9a-fA-F]{40}$/.test(v)) { showErr('Enter a valid Ethereum address (0x… 40 hex characters).'); return; }
  _hasSigner = false;
  handleAddress(v);
}

document.getElementById('connectBtn').addEventListener('click', connectWallet);
document.getElementById('pasteBtn').addEventListener('click', previewAddress);
document.getElementById('pasteAddr').addEventListener('keydown', function(e){ if (e.key === 'Enter') previewAddress(); });

// Auto-run when arriving with ?address=0x… — the homepage's "paste to
// preview" input hands off here instead of duplicating the whole connect
// flow (wallet-connect + polling + verified-record render) on two pages.
// Otherwise, try to resume a remembered wallet (live eth_accounts or the
// localStorage cache) so a returning visitor isn't dropped back on the
// "Connect Wallet" hero every time.
(function(){
  var qAddr = new URLSearchParams(location.search).get('address');
  if (qAddr && /^0x[0-9a-fA-F]{40}$/.test(qAddr.trim())) {
    document.getElementById('pasteAddr').value = qAddr.trim();
    _hasSigner = false;
    handleAddress(qAddr.trim());
    return;
  }
  autoResumeConnection();
})();

async function handleAddress(addr){
  document.getElementById('connectErr').style.display = 'none';
  var connectBtn = document.getElementById('connectBtn');
  var pasteBtn = document.getElementById('pasteBtn');
  connectBtn.disabled = true; pasteBtn.disabled = true;
  document.getElementById('pageMain').classList.add('is-active'); // desktop: stop centering, flow top-down once there's real content
  document.getElementById('result').innerHTML = '<div class="skel"></div>';

  var res;
  try {
    var r = await fetch('/api/connect', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ address: addr }) });
    res = await r.json();
    if (!r.ok) throw new Error(res.error || 'connect_failed');
  } catch (e) {
    document.getElementById('result').innerHTML = '<div class="empty">Could not connect that wallet. ' + esc(e.message) + '</div>';
    connectBtn.disabled = false; pasteBtn.disabled = false;
    return;
  }

  _currentUserId = res.user_id;
  _currentAddress = res.address;
  saveConnectCache(res.user_id, res.address, _hasSigner);
  renderRaw(res);
  pollStatus();
}

// Fast path for a remembered wallet — loads the already-computed profile
// directly (GET /api/trader-record/:userId) instead of re-running
// /api/connect's raw-activity refetch + background backfill on every page
// load. Used on return visits so a remembered wallet doesn't hammer
// Polymarket's activity API just to redisplay a page.
async function loadRecordFast(userId, address, hasSigner){
  _currentUserId = userId;
  _currentAddress = address;
  _hasSigner = hasSigner;
  document.getElementById('pasteAddr').value = address;
  document.getElementById('connectBtn').disabled = true;
  document.getElementById('pasteBtn').disabled = true;
  document.getElementById('pageMain').classList.add('is-active');
  document.getElementById('result').innerHTML = '<div class="skel"></div>';
  try {
    var r = await fetch('/api/trader-record/' + encodeURIComponent(userId));
    if (!r.ok) throw new Error('stale_cache');
    var p = await r.json();
    document.getElementById('result').innerHTML = listingNoticeHtml();
    wireOptOut();
    renderVerified(p);
  } catch (e) {
    // Cached user_id no longer resolves (e.g. DB reset) — drop the cache
    // and fall back to the normal connect hero instead of a dead skeleton.
    clearConnectCache();
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('pasteBtn').disabled = false;
    document.getElementById('pageMain').classList.remove('is-active');
    document.getElementById('result').innerHTML = '';
  }
}

// Runs on every page load (after the ?address= handoff check below). Prefers
// a live, currently-authorized wallet over the cache — so switching accounts
// in MetaMask is picked up rather than stubbornly reloading the old one —
// and falls back to the cache when no wallet extension is available/unlocked.
async function autoResumeConnection(){
  var cache = readConnectCache();
  var liveAddr = null;
  if (window.ethereum) {
    try {
      var accounts = await window.ethereum.request({ method: 'eth_accounts' });
      if (accounts && accounts[0]) liveAddr = accounts[0].toLowerCase();
    } catch (e) {}
  }

  if (liveAddr) {
    _hasSigner = true;
    if (cache && cache.address && cache.address.toLowerCase() === liveAddr
        && (Date.now() - cache.lastFullTs) < FULL_REFRESH_INTERVAL_MS) {
      loadRecordFast(cache.userId, cache.address, true);
    } else {
      // New wallet, or cache stale enough to be worth a real refresh.
      handleAddress(liveAddr);
    }
    return;
  }

  // No live wallet permission (extension locked/absent/never granted this
  // site) — fall back to whatever was remembered, signer or previewed alike.
  if (cache && cache.address) {
    loadRecordFast(cache.userId, cache.address, cache.hasSigner);
  }
}

function listingNoticeHtml(){
  return '<div class="listing-notice" id="listingNotice">'
    + '<span>Connecting adds you to the public HYPERFLEX leaderboard automatically — your trades are already public on-chain, but being ranked is a separate, reversible choice.</span>'
    + '<label><input type="checkbox" id="optOutToggle"> Opt out</label>'
  + '</div>';
}

function wireOptOut(){
  var box = document.getElementById('optOutToggle');
  if (!box) return;
  box.addEventListener('change', async function(){
    if (!_hasSigner) {
      box.checked = !box.checked;
      showErr('Connect your wallet (not just a pasted address) to change your listing status.');
      return;
    }
    var ts = Date.now();
    var message = 'HYPERFLEX leaderboard opt-out for ' + _currentAddress + ' — user ' + _currentUserId + ' — ts ' + ts;
    try {
      var sig = await window.ethereum.request({ method: 'personal_sign', params: [message, _currentAddress] });
      var r = await fetch('/api/connect/opt-out', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ user_id: _currentUserId, address: _currentAddress, signature: sig, opted_out: box.checked, timestamp: ts })
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || 'opt_out_failed');
    } catch (e) {
      box.checked = !box.checked;
      showErr('Could not update listing status: ' + e.message);
    }
  });
}

function renderRaw(res){
  var html = '';
  html += listingNoticeHtml();
  html += '<div class="verify-banner" id="verifyBanner"><span class="verify-spin"></span> Verifying against Polymarket settlement data…</div>';
  html += '<div class="raw-card">'
    + '<div class="raw-identity">'
      + '<div class="raw-avatar" style="background:'+avatarColor(res.user_id)+'">'+esc(initials({address: res.address}))+'</div>'
      + '<div class="raw-addr">'+esc(res.address.slice(0,6)+'…'+res.address.slice(-4))+'</div>'
    + '</div>'
    + '<div class="raw-stats">Found <b>'+esc(res.raw_activity_events)+'</b> activity events across <b>'+esc(res.raw_distinct_markets)+'</b> markets on Polymarket. Unverified — the score below appears once settlement is independently checked, never guessed at.</div>'
  + '</div>';
  document.getElementById('result').innerHTML = html;
  wireOptOut();
}

function pollStatus(){
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(async function(){
    try {
      var r = await fetch('/api/connect/status/' + _currentUserId);
      var d = await r.json();
      if (d.status === 'done') {
        clearInterval(_pollTimer);
        loadVerifiedRecord();
      }
    } catch (e) {}
  }, 2000);
}

async function loadVerifiedRecord(){
  var banner = document.getElementById('verifyBanner');
  if (banner) banner.remove();
  var rawCard = document.querySelector('.raw-card');
  if (rawCard) rawCard.remove();
  try {
    var r = await fetch('/api/trader-record/' + _currentUserId);
    var p = await r.json();
    if (!r.ok) throw new Error(p.error || 'load_failed');
    renderVerified(p);
  } catch (e) {
    var div = document.createElement('div');
    div.className = 'empty';
    div.textContent = 'Could not load your verified record: ' + e.message;
    document.getElementById('result').appendChild(div);
  }
}

// Renders the same record shape as /trader/:handle — same computation,
// single source of truth (_buildTraderProfile server-side). Appends into
// #result rather than replacing #main, since the listing notice above it
// stays in place.
function renderVerified(p){
  var handle = p.username ? '@'+p.username : (p.display_name || 'Trader');
  var addr = p.polymarket_address ? (p.polymarket_address.slice(0,6)+'…'+p.polymarket_address.slice(-4)) : null;
  var eligible = p.eligible;
  var scoreCls = !eligible ? 'is-neutral' : (p.score_pct >= 0 ? 'is-positive' : 'is-negative');
  var verdictText = eligible ? p.verdict : (p.eligibility_note || 'Not yet ranked.');
  // Canonical shareable profile — same /@handle-first, /trader/:address-
  // fallback rule as every other card on the site (trader-card.js,
  // home-kings/feed win-cards). This inline preview computes the identical
  // record server-side but doesn't carry Share on X / Passport link / the
  // rest of the canonical page — link out to it instead of duplicating it.
  var profileHref = p.username ? '/@' + encodeURIComponent(p.username)
    : p.polymarket_address ? '/trader/' + encodeURIComponent(p.polymarket_address)
    : null;

  var html = '<div class="p-header">'
    + '<div class="p-identity">'
      + '<div class="p-avatar" style="background:'+avatarColor(p.user_id || p.polymarket_address)+'">'+esc(initials(p))+'</div>'
      + '<div>'
        + '<div class="p-handle">'+esc(handle)+'</div>'
        + (addr ? '<button class="p-address" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+esc(p.polymarket_address)+'\')" title="Copy full address">'+esc(addr)+' <span>⧉</span></button>' : '')
      + '</div>'
      + (profileHref ? '<a class="p-profile-link" href="'+esc(profileHref)+'">View profile →</a>' : '')
    + '</div>'
    + '<div class="p-verdict' + (eligible ? '' : ' is-ineligible') + '">' + esc(verdictText) + '</div>'
    + (eligible ? '<div class="p-scoreline '+scoreCls+'"><span class="p-score">'+esc(fmtPct(p.score_pct))+'</span><span class="p-n">'+esc(p.n)+' trades</span></div>' : '')
    + (eligible && p.scope_label ? '<div class="p-scope">'+esc(p.scope_label)+'</div>' : '');

  // Non-qualifying: a progress bar, not a rejection. Parsed from
  // eligibility_note ("Not yet ranked — needs 10 durable resolved trades
  // (has 3)") rather than hardcoding the threshold, so this doesn't drift
  // if ROI_MIN_N_FLOOR ever changes server-side.
  // Provisional headline — a wallet under the ranking floor still gets a
  // real number, computed via the identical scoring pipeline a ranked
  // wallet uses (see server.js _buildTraderProfile). The 10-durable floor
  // gates public RANKING, not seeing your own score.
  if (!eligible && p.provisional) {
    var pv = p.provisional;
    var pvScoreCls = pv.score_pct >= 0 ? 'is-positive' : 'is-negative';
    html += '<div class="p-scoreline ' + pvScoreCls + ' is-provisional"><span class="p-score">' + esc(fmtPct(pv.score_pct)) + '</span><span class="p-n">' + esc(pv.n) + ' trades</span></div>'
      + '<div class="p-provisional-label">' + esc(pv.label) + '</div>'
      + '<div class="stat-row">'
        + '<div class="stat-tile"><div class="stat-label">Realized ROI</div><div class="stat-value ' + pvScoreCls + '">' + esc(fmtPct(pv.raw_weighted_roi_pct)) + '</div></div>'
        + '<div class="stat-tile"><div class="stat-label">Win Rate</div><div class="stat-value">' + esc(pv.win_rate_pct != null ? pv.win_rate_pct.toFixed(1) + '%' : '—') + '</div></div>'
        + '<div class="stat-tile"><div class="stat-label">Durable Trades</div><div class="stat-value">' + esc(pv.n) + '</div></div>'
      + '</div>';
  }

  if (!eligible) {
    var m = /needs (\d+).*?\(has (\d+)\)/.exec(p.eligibility_note || '');
    if (m) {
      var need = parseInt(m[1], 10), has = parseInt(m[2], 10);
      var pct = need > 0 ? Math.min(100, Math.round((has / need) * 100)) : 0;
      html += '<div class="qual-progress">'
        + '<div class="qual-bar-track"><div class="qual-bar-fill" style="width:'+pct+'%;"></div></div>'
        + '<div class="qual-note">'+has+' of '+need+' durable resolved trades needed to appear on the public leaderboard.</div>'
      + '</div>';
    }
  }
  html += '</div>';

  if (eligible) {
    html += '<div class="p-section"><div class="p-section-title">Your record</div><div class="stat-row">'
      + '<div class="stat-tile"><div class="stat-label">Realized ROI</div><div class="stat-value '+(p.headline.realized_roi_pct>=0?'is-positive':'is-negative')+'">'+esc(fmtPct(p.headline.realized_roi_pct))+'</div></div>'
      + '<div class="stat-tile"><div class="stat-label">Win Rate</div><div class="stat-value">'+esc(p.headline.win_rate_pct!=null?p.headline.win_rate_pct.toFixed(1)+'%':'—')+'</div></div>'
      + '<div class="stat-tile"><div class="stat-label">Resolved Trades</div><div class="stat-value">'+esc(p.headline.n)+'</div></div>'
      + '<div class="stat-tile"><div class="stat-label">Capital Deployed</div><div class="stat-value">'+esc(fmtUsd(p.headline.total_capital_usd))+'</div></div>'
      + '<div class="stat-tile"><div class="stat-label">Avg Return / Trade</div><div class="stat-value '+(p.headline.avg_return_pct>=0?'is-positive':'is-negative')+'">'+esc(fmtPct(p.headline.avg_return_pct))+'</div></div>'
    + '</div></div>';
  }

  // Equity curve — built client-side from trade_history (already in this
  // payload), so no extra round trip. Cumulative realized PnL over
  // cumulative capital deployed, which is the same basis the headline
  // realized-ROI number uses; a curve computed on a different basis than
  // the number printed above it would be its own small lie.
  html += equityCurveHtml(p);

  // Slot for the similar-but-better matcher — the part of this page that
  // isn't just a restatement of what Polymarket already shows you.
  // Loaded async so the wallet's own record paints immediately.
  html += '<div id="similarSlot"></div>';

  html += '<div class="p-section"><div class="p-section-title">Best call &amp; worst call</div><div class="call-pair">'
    + callCardHtml(p.best_call, 'best')
    + callCardHtml(p.worst_call, 'worst')
  + '</div></div>';

  if (p.specialty_full && p.specialty_full.length) {
    html += '<div class="p-section"><div class="p-section-title">Specialty breakdown</div><div class="specialty-grid">'
      + p.specialty_full.map(function(s){
          var wrCls = s.win_rate_pct >= 50 ? 'is-positive' : 'is-negative';
          var tileCls = 'specialty-tile' + (s.small_sample ? ' is-small-sample' : '');
          return '<div class="'+tileCls+'">'
            + '<div class="specialty-cat">'+esc(s.category)+'</div>'
            + '<div class="specialty-wr '+wrCls+'">'+esc(s.win_rate_pct.toFixed(1))+'%</div>'
            + '<div class="specialty-n">'+esc(s.n)+' trades'+(s.avg_roi_pct!=null?' · avg '+esc(fmtPct(s.avg_roi_pct)):'')+'</div>'
            + (s.small_sample ? '<div class="specialty-small-tag">small sample</div>' : '')
          + '</div>';
        }).join('')
    + '</div></div>';
  }

  if (p.form && p.form.length) {
    var trendCls = p.trend === 'up' ? 'up' : p.trend === 'down' ? 'down' : '';
    var trendLabel = p.trend === 'up' ? 'Heating up' : p.trend === 'down' ? 'Cooling off' : 'Steady';
    var streakText = p.streak && p.streak.count ? p.streak.count + (p.streak.type==='win'?'W':p.streak.type==='loss'?'L':'P') + ' streak' : '';
    html += '<div class="p-section"><div class="p-section-title">Recent form</div><div class="form-row">'
      + HFXTraderCard.sparkline(p.form, 140, 36)
      + (streakText ? '<span class="tcard-streak is-'+esc(p.streak.type)+'">'+esc(streakText)+'</span>' : '')
      + '<span class="form-trend '+trendCls+'">'+esc(trendLabel)+'</span>'
    + '</div></div>';
  }

  // Non-qualifying wallets get a pointed next step per CLAUDE.md rule 4 —
  // never a dead end. Real live markets, grouped by topic, loaded async
  // below (loadCategoryBrowse) so the rest of the record paints first.
  if (!eligible) {
    html += '<div id="categoryBrowse"></div>';
  }

  html += '<div class="p-section"><div class="p-section-title">Full trade history</div>'
    + (p.ephemeral_excluded_note ? '<div class="void-note" style="margin-bottom:14px;">'+esc(p.ephemeral_excluded_note)+'</div>' : '')
    + '<div class="hist-filters">'
      + '<select id="histCategory"><option value="">All categories</option></select>'
      + '<button data-result="" class="active">All</button>'
      + '<button data-result="win">Wins</button>'
      + '<button data-result="loss">Losses</button>'
    + '</div>'
    + '<div class="hist-count" id="histCount"></div>'
    + '<div style="overflow-x:auto;"><table class="hist-table" id="histTable">'
      + '<thead><tr><th>Market</th><th>Side</th><th>Entry</th><th>Result</th><th>ROI</th><th>P&amp;L</th><th>Closed</th><th>Scope</th></tr></thead>'
      + '<tbody id="histBody"></tbody>'
    + '</table></div>'
  + '</div>';

  html += '<div class="p-section"><div class="p-section-title">Open positions <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">— not counted in the score above</span></div>'
    + (p.open_positions_count
      ? '<div class="open-list">' + p.open_positions.map(function(o){
          return '<div class="open-row"><span class="oq">'+esc((o.question||'').slice(0,100))+'</span><span class="os">'+esc(o.side)+(o.probability!=null?' · '+Math.round(o.probability*100)+'¢':'')+'</span></div>';
        }).join('') + (p.open_positions_count > p.open_positions.length ? '<div class="hist-count">+'+(p.open_positions_count-p.open_positions.length)+' more not shown</div>' : '') + '</div>'
      : '<div class="hist-count">No open positions.</div>')
  + '</div>';

  html += '<div class="p-section"><div class="p-section-title">Disclosure</div><div class="void-note">'+esc(p.void_note)+'</div></div>';

  var slot = document.createElement('div');
  slot.id = 'verifiedSlot';
  slot.innerHTML = html;
  document.getElementById('result').appendChild(slot);

  // Wire history filters (client-side — full history is already fetched).
  var allTrades = p.trade_history || [];
  var cats = [...new Set(allTrades.map(function(t){return t.category;}))].sort();
  var catSel = document.getElementById('histCategory');
  cats.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o); });

  var activeResult = '';
  function renderHistory(){
    var cat = catSel.value;
    var rows = allTrades.filter(function(t){
      return (!cat || t.category === cat) && (!activeResult || t.result === activeResult);
    });
    document.getElementById('histCount').textContent = rows.length + ' of ' + allTrades.length + ' resolved trades' + (p.trade_history_total > allTrades.length ? ' (showing most recent ' + allTrades.length + ' of ' + p.trade_history_total + ' total)' : '');
    document.getElementById('histBody').innerHTML = rows.map(function(t){
      var isEphemeral = t.market_durability === 'ephemeral';
      return '<tr' + (isEphemeral ? ' style="opacity:.55;"' : '') + '>'
        + '<td class="hist-q">'+esc(t.question)+'</td>'
        + '<td>'+esc(t.side)+'</td>'
        + '<td>'+(t.entry_price!=null?Math.round(t.entry_price*100)+'¢':'—')+'</td>'
        + '<td class="hist-result '+esc(t.result)+'">'+esc(t.result.toUpperCase())+'</td>'
        + '<td>'+esc(fmtPct(t.realized_roi_pct))+'</td>'
        + '<td>'+esc(fmtUsd(t.realized_pnl))+'</td>'
        + '<td>'+esc(fmtDate(t.closed_at))+'</td>'
        + '<td style="color:var(--muted);">'+(isEphemeral ? 'Ephemeral — excluded' : 'Durable')+'</td>'
      + '</tr>';
    }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px;">No trades match this filter.</td></tr>';
  }
  catSel.addEventListener('change', renderHistory);
  document.querySelectorAll('.hist-filters button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.hist-filters button').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      activeResult = btn.dataset.result;
      renderHistory();
    });
  });
  renderHistory();

  loadSimilarTraders(p.username || p.polymarket_address || p.user_id);
  if (!eligible) loadCategoryBrowse(p);
}

// ── Category browse (rule 4) ──────────────────────────────────────────
// /api/topics is the SAME already-live grouping (hot-markets topic
// classifier) that powers /explore's topic dashboard — reused as-is
// rather than inventing a second live-market taxonomy alongside it.
function loadCategoryBrowse(p){
  var el = document.getElementById('categoryBrowse');
  if (!el) return;
  el.innerHTML = '<div class="cat-browse"><div class="skel" style="height:160px;"></div></div>';

  fetch('/api/topics?limit=60')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      var topics = (d && d.topics) || [];
      if (!topics.length) { el.innerHTML = '<div class="category-stub">Markets are warming up — check back shortly, or browse the current leaderboard at <a href="/traders">/traders</a>.</div>'; return; }

      // Personalization: if the wallet already has open positions, the
      // topic they show up in most is the default tab — "you're already
      // here" beats a cold "pick a topic" prompt. Works even at ZERO
      // resolved trades (the common non-qualifying case) because this
      // reads open_positions[].topic, not the resolved-trade history.
      var topicCounts = {};
      (p.open_positions || []).forEach(function(o){ if (o.topic) topicCounts[o.topic] = (topicCounts[o.topic] || 0) + 1; });
      var topWalletTopic = Object.keys(topicCounts).sort(function(a,b){ return topicCounts[b]-topicCounts[a]; })[0] || null;
      var defaultTopic = topics.some(function(t){ return t.topic === topWalletTopic; }) ? topWalletTopic : topics[0].topic;

      // A raw, factual reason to look twice — NOT a prediction or an edge
      // score (that stays behind Gate 3 until it clears the accuracy bar).
      // Price movement and time-to-resolution are observable facts already
      // sitting unused on this same /api/topics tile, same discipline as
      // /feed's Live Feed reasonFor().
      function whyFor(m){
        var chg = m.yes_price_change_7d != null ? Math.round(m.yes_price_change_7d * 100) : null;
        if (chg != null && Math.abs(chg) >= 3) {
          return { text: (chg > 0 ? '↑ Moved +' : '↓ Moved ') + chg + 'pt' + (Math.abs(chg) === 1 ? '' : 's') + ' this week', cls: chg > 0 ? 'is-positive' : 'is-negative' };
        }
        if (m.days_until_end != null && m.days_until_end <= 3) {
          return { text: 'Closing soon — ' + m.days_until_end + 'd left', cls: 'is-warn' };
        }
        if (m.days_until_end != null) {
          return { text: 'Resolves in ' + m.days_until_end + 'd', cls: '' };
        }
        return null;
      }
      function renderGrid(topic){
        var group = topics.filter(function(t){ return t.topic === topic; })[0];
        var markets = (group ? group.markets : []).slice(0, 8);
        document.getElementById('catMarketGrid').innerHTML = markets.length
          ? markets.map(function(m){
              var q = m.market_question || m.event_title || '';
              var price = m.yes_price != null ? Math.round(m.yes_price * 100) + '¢' : null;
              var img = m.image || m.event_image_url;
              var why = whyFor(m);
              return '<a class="cat-market-card" href="'+esc(m.cta_href || ('/market/'+m.slug))+'">'
                + '<div class="cmc-img" style="'+(img ? 'background-image:url('+JSON.stringify(img)+')' : '')+'"></div>'
                + '<div class="cmc-body">'
                + (why ? '<div class="cmc-why '+esc(why.cls)+'">'+esc(why.text)+'</div>' : '')
                + '<div class="cmc-q">'+esc(q.slice(0,90))+'</div>'
                + '<div class="cmc-meta"><span>'+esc(m.volume_24h_label || '')+'</span>'+(price ? '<span class="cmc-price">'+esc(price)+' YES</span>' : '')+'</div></div>'
              + '</a>';
            }).join('')
          : '<div class="hist-count">No live markets in this topic right now.</div>';
      }

      var hint = topWalletTopic
        ? '<div class="cat-browse-hint">You already have open positions in <b>'+esc(topWalletTopic)+'</b> — more below.</div>'
        : '';

      el.innerHTML = '<div class="cat-browse">'
        + '<div class="cat-browse-title">Build toward a ranked record</div>'
        + '<div class="cat-browse-sub">Durable markets — resolving weeks or months out — are what count toward your score. Browse by topic and place a trade to start building yours.</div>'
        + hint
        + '<div class="cat-chips" id="catChips">' + topics.map(function(t){
            return '<button class="cat-chip'+(t.topic===defaultTopic?' active':'')+'" data-topic="'+esc(t.topic)+'">'+esc(t.topic)+' ('+t.count+')</button>';
          }).join('') + '</div>'
        + '<div class="cat-market-grid" id="catMarketGrid"></div>'
      + '</div>';

      renderGrid(defaultTopic);
      document.getElementById('catChips').addEventListener('click', function(e){
        var btn = e.target.closest('.cat-chip');
        if (!btn) return;
        document.querySelectorAll('.cat-chip').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        renderGrid(btn.dataset.topic);
      });
    })
    .catch(function(){
      el.innerHTML = '<div class="category-stub">Couldn\'t load live markets right now. Browse the current leaderboard at <a href="/traders">/traders</a> instead.</div>';
    });
}

// ── Equity curve ───────────────────────────────────────────────────────
// Durable trades only, matching what the score is computed on — an
// equity curve drawn over trades the score explicitly excludes would
// disagree with the number printed directly above it.
function equityCurveHtml(p){
  var rows = (p.trade_history || [])
    .filter(function(t){ return t.market_durability !== 'ephemeral'
      && t.closed_at && t.entry_cost_usd > 0 && t.realized_pnl != null; })
    .sort(function(a,b){ return new Date(a.closed_at) - new Date(b.closed_at); });
  if (rows.length < 2) return '';

  var cumPnl = 0, cumCost = 0, pts = [];
  rows.forEach(function(t){
    cumCost += Number(t.entry_cost_usd);
    cumPnl  += Number(t.realized_pnl);
    pts.push({ t: t.closed_at, roi: (cumPnl / cumCost) * 100 });
  });

  var vals = pts.map(function(x){ return x.roi; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  // Always keep 0 in frame — a curve that never shows breakeven hides
  // whether the trader is above or below water, which is the whole point.
  min = Math.min(min, 0); max = Math.max(max, 0);
  if (max === min) max = min + 1;

  var W = 900, H = 180, padY = 12;
  var y = function(v){ return H - padY - ((v - min) / (max - min)) * (H - padY * 2); };
  var x = function(i){ return (i / (pts.length - 1)) * W; };

  var line = pts.map(function(pt,i){ return x(i).toFixed(1) + ',' + y(pt.roi).toFixed(1); }).join(' ');
  var zeroY = y(0).toFixed(1);
  var last = vals[vals.length - 1];
  var up = last >= 0;
  var stroke = up ? '#00e68a' : '#ff4d6a';
  var fill = up ? 'rgba(0,230,138,.12)' : 'rgba(255,77,106,.10)';

  var area = '0,' + zeroY + ' ' + line + ' ' + W + ',' + zeroY;
  var first = pts[0].t ? fmtDate(pts[0].t) : '';
  var lastD = pts[pts.length-1].t ? fmtDate(pts[pts.length-1].t) : '';

  return '<div class="curve-card">'
    + '<div class="curve-head"><span class="curve-title">Cumulative realized ROI</span>'
    + '<span class="curve-now ' + (up ? 'is-positive' : 'is-negative') + '">'
    + (last >= 0 ? '+' : '') + last.toFixed(1) + '%</span></div>'
    + '<svg class="curve" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" '
    + 'aria-label="Cumulative realized ROI across ' + pts.length + ' durable trades, ending at '
    + last.toFixed(1) + ' percent">'
    + '<polygon points="' + area + '" fill="' + fill + '"></polygon>'
    + '<line x1="0" y1="' + zeroY + '" x2="' + W + '" y2="' + zeroY
    + '" stroke="rgba(240,240,245,.28)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></line>'
    + '<polyline points="' + line + '" fill="none" stroke="' + stroke
    + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>'
    + '</svg>'
    + '<div class="curve-sub">' + esc(first) + ' → ' + esc(lastD) + ' · ' + pts.length
    + ' durable trades · dashed line = breakeven</div>'
  + '</div>';
}

// ── Traders with your book, beating you at it ──────────────────────────
// The differentiated surface: not a leaderboard of strangers, but people
// playing the same categories this wallet plays who are outperforming on
// exactly those categories. Every row carries their score and n.
function loadSimilarTraders(handle){
  if (!handle) return;
  fetch('/api/similar-traders/' + encodeURIComponent(handle))
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      var slot = document.getElementById('similarSlot');
      if (!slot || !d || !d.matches || !d.matches.length) return;

      // When every match headlines the same category — common, since it's
      // the one you're worst at — stating "you X% over N trades" on each
      // row repeats an identical clause five times. Hoist it into one
      // context line above the list and let each row carry only what
      // differs: who they are, and their number.
      var cats = d.matches.map(function(m){ return m.headline && m.headline.category; });
      var onlyCat = cats.every(function(c){ return c && c === cats[0]; }) ? cats[0] : null;
      var ctx = '';
      if (onlyCat) {
        var h0 = d.matches[0].headline;
        ctx = '<div class="sim-context">Your <b>' + esc(onlyCat) + '</b> book: '
            + '<span class="' + (h0.your_roi_pct >= 0 ? 'is-positive' : 'is-negative') + '">'
            + esc(fmtPct(h0.your_roi_pct)) + '</span> over ' + esc(h0.your_n)
            + ' trades. These traders play it better:</div>';
      }

      slot.innerHTML =
        '<div class="p-section"><div class="p-section-title">Trades like you — but better '
        + '<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">'
        + '— matched on the categories you actually play</span></div>'
        + ctx
        + '<div class="similar-list">'
        + d.matches.map(function(m){
            var h = m.headline;
            var name = m.username || m.display_name || 'Trader';
            var link = m.username ? '/@' + encodeURIComponent(m.username) : null;
            var nameHtml = link
              ? '<a href="'+esc(link)+'" class="sim-name">'+esc(name)+'</a>'
              : '<span class="sim-name">'+esc(name)+'</span>';
            // With the shared context hoisted above, each row states only
            // their side of the comparison.
            var compare = !h ? ''
              : onlyCat
                ? '<div class="sim-compare"><span class="'+(h.their_roi_pct>=0?'is-positive':'is-negative')+'">'
                  + esc(fmtPct(h.their_roi_pct))+'</span> over '+esc(h.their_n)+' '+esc(h.category)+' trades</div>'
                : '<div class="sim-compare">In <b>'+esc(h.category)+'</b>: '
                  + 'you <span class="'+(h.your_roi_pct>=0?'is-positive':'is-negative')+'">'
                  + esc(fmtPct(h.your_roi_pct))+'</span> over '+esc(h.your_n)+' · '
                  + 'them <span class="'+(h.their_roi_pct>=0?'is-positive':'is-negative')+'">'
                  + esc(fmtPct(h.their_roi_pct))+'</span> over '+esc(h.their_n)+'</div>';
            // Thin confidence (min shared-category n 5-14): edge number still
            // shows, but muted rather than the loud strong/moderate hero, with
            // the sample size called out right next to it instead of only
            // living in scope_label text below the fold.
            var isThin = m.confidence === 'thin';
            var edgeCls = 'sim-edge' + (isThin ? ' is-thin' : ' is-positive');
            var sampleTag = isThin
              ? '<span class="sim-sample-tag">small sample · '+esc(m.confidence_n)+' trades</span>'
              : '';
            return '<div class="sim-row">'
              + '<div class="sim-main">'
                + '<div class="sim-head">'+nameHtml
                + '<span class="sim-sim">'+esc(m.similarity_pct.toFixed(0))+'% similar book</span></div>'
                + compare
                + '<div class="sim-scope">'+esc(m.shared_categories.join(' · '))+' · '+esc(m.scope_label)+'</div>'
              + '</div>'
              + '<div class="sim-edge-wrap">'
                + '<div class="'+edgeCls+'">+'+esc(m.edge_pct.toFixed(1))+'%<small>vs you</small></div>'
                + sampleTag
              + '</div>'
            + '</div>';
          }).join('')
        + '</div></div>';
    })
    .catch(function(e){ console.warn('[similar-traders]', e); });
}
</script>
